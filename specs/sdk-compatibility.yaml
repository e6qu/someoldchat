# This inventory is deliberately fail-closed. A release is not a compatibility
# claim until its immutable artifact digest, provenance, and executable suite
# are recorded. The current Go contract tests do not substitute for these
# suites.
#
# What `qualified` covers, precisely:
#
#   - the Web API surface: genuine end to end. An official client calls this
#     product's own methods and parses this product's own responses.
#   - the Socket Mode and real-time *transports*: genuine. An official client
#     opens the socket this product hands it, receives the frames, acknowledges
#     them, and parses the envelope.
#
# Event-surface coverage is method- and topic-specific. Node, Python, and Java
# Socket Mode qualifications consume a real service-posted message that
# internal/service hydrates and translates after installed-bot visibility is
# proved; the Node RTM qualification does the same for the connected user.
# Bolt callback suites still submit an independently constructed signed event
# callback, so they qualify framework decoding and request authentication, not
# producer translation. Immutable producer snapshots and bot/user perspective
# filtering now cover message create/change/delete and file create/share;
# file-unshare production and live-Slack differential outcomes remain outside
# the qualified slice. See the events-api decision in specs/compatibility.yaml.
status: qualified

