    note: >-
      slack_sdk.rtm_v2.RTMClient opens the socket rtm.connect hands it and
      consumes a real message a user token posted after the socket opened.
      The client drops events whose bot_id is its own (learned from
      auth.test), so the suite also posts as the bot and requires that post
      to be filtered and the person's post, from a user token issued to the
      same app, to carry no bot_id.
