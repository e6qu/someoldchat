    license: MIT
    suite: passed
    suite_path: tests/official-sdk-qualification/node-web-api/qualification.mjs
    note: >-
      InstallProvider installs an app from nothing (install path, state
      cookie, callback, oauth.v2.access, installation store, authorize), then
      reinstalls with an implied redirect_uri and keeps the bot user, and
      completes a user-scope-only install. The fixture's
      /qualification/authorize stands in for the browser consent page by
      approving through the same service call; the page itself is qualified by
      the browser suite.
  - id: node-bolt
    ecosystem: npm
    package: '@slack/bolt'
    upstream: https://github.com/slackapi/bolt-js
    release: 5.0.0
    revision: e2b90aa003e5a1de256b31c37b29d032566585ab
    artifact: slack-bolt-5.0.0.tgz
    sha256: 62cedd4e4520ce963721d3a82bf6f5c5a9fc6b66b920eaf4d1cf4bb2f483f84b
    license: MIT
    suite: passed
    suite_path: tests/official-sdk-qualification/node-bolt/qualification.mjs
    note: >-
      Event-surface suite. Every event reaches Bolt through the production
      Events API processor (projection, subscription filter, signing).
      reaction_added is translated from a record the fixture appends;
      link_shared is produced by a real chat.postMessage sharing a link on the
      app's unfurl domain, and the Bolt handler answers it with chat.unfurl by
      unfurl_id and source, then reads the is_app_unfurl attachment back from
      conversations.history. The custom-function round trip is produced end to
      end: a workflow run emits function_executed with an execution-scoped
      xwfp- token, Bolt's function listener posts a button with it, the
      member's click reaches Bolt's action listener with function_data, and
      complete() finishes the execution through functions.completeSuccess.
