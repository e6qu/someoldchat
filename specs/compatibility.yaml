      - go-test:internal/api/slack:TestUserObjectCarriesRolesBotIdentityAndFetchableImages
      - go-test:internal/api/slack:TestAdminUsersRemoveDeactivatesUser
    deviations:
      - tz is the zone the member's own browser last reported to the web client (Slack's automatic time zone); a member who has never used the web client reports tz UTC with a zero offset. tz_label is the zone's abbreviation (for example EDT) rather than Slack's long name.
      - A workspace has owners but no distinguished primary owner, so every owner reports is_primary_owner.
      - updated is recorded from schema 181 onward; a member whose record has not changed since reports 0.
