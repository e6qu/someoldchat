  - method: chat.postMessage
    status: schema-compatible
    provenance: slack-api-specs-openapi
    reference: https://docs.slack.dev/reference/methods/chat.postMessage/
    evidence:
      - go-test:internal/api/slack:TestPostMessageForm
      - go-test:internal/api/slack:TestBotTokenMessagesCarryBotIdentity
      - go-test:internal/api/slack:TestPostMessageResolvesNamesAndUsers
      - go-test:internal/api/slack:TestChatWritePublicPostsWithoutJoining
      - go-test:internal/api/slack:TestAsUserIsAcceptedFromAUserToken
      - go-test:internal/api/slack:TestReplyingToAReplyJoinsTheRootThread
      - go-test:internal/api/slack:TestMessageMethodsAnswerInvalidBlocks
    deviations:
      - >-
        The full current payload is validated and persisted. link_names,
        unfurl_links and unfurl_media are stored with the message but not acted
        on: the reference's user-group linking for link_names and its link and
        media unfurling are not implemented.
      - The Web API now enforces the documented posting allowance — one message per second per channel with a short burst — and a per-method budget, answering 429 with Retry-After. Every method is held to the tier Slack publishes for it (rate-limit-tiers decision); chat.postMessage's method budget is the special tier's several hundred a minute, enforced as the pinned SDK's 600. A method budget answers Slack's ratelimited and the per-channel posting allowance answers the pinned rate_limited (provenance under rate-limit-codes). Every web replica of a deployment draws from one budget, held in the chat module's store wherever more than one replica can run.
    audit:
      downgraded_from: behavior-compatible
      reason: >-
        The 2026-07-29 current-reference audit found that route registration and
        local message tests had been promoted as full method behavior despite
        unsupported documented arguments and rate-limit behavior.
      evidence:
        - source:internal/api/slack/handler.go
        - https://docs.slack.dev/reference/methods/chat.postMessage/
