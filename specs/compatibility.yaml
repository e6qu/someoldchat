  - method: chat.postMessage
    status: schema-compatible
    provenance: slack-api-specs-openapi
    reference: https://docs.slack.dev/reference/methods/chat.postMessage/
    evidence:
      - go-test:internal/api/slack:TestPostMessageForm
      - go-test:internal/api/slack:TestBotTokenMessagesCarryBotIdentity
      - go-test:internal/api/slack:TestPostMessageResolvesNamesAndUsers
      - go-test:internal/api/slack:TestChatWritePublicPostsWithoutJoining
      - go-test:internal/api/slack:TestAsUserIsAcceptedFromAUserToken
      - go-test:internal/api/slack:TestReplyingToAReplyJoinsTheRootThread
      - go-test:internal/api/slack:TestMessageMethodsAnswerInvalidBlocks
    deviations:
      - >-
        The full current payload is validated and persisted, but link-name
        expansion and external media unfurl fetching have not been qualified
        against live Slack outcomes.
      - The Web API now enforces the documented posting allowance — one message per second per channel with a short burst — and a uniform per-method budget at Tier 4's floor, answering 429 with Retry-After. A method budget answers Slack's ratelimited and the per-channel posting allowance answers the pinned rate_limited (provenance under rate-limit-codes). Budgets are replica-local and per-method tier assignments below that floor are not enforced.
    audit:
      downgraded_from: behavior-compatible
      reason: >-
        The 2026-07-29 current-reference audit found that route registration and
        local message tests had been promoted as full method behavior despite
        unsupported documented arguments and rate-limit behavior.
      evidence:
        - source:internal/api/slack/handler.go
        - https://docs.slack.dev/reference/methods/chat.postMessage/
