    deviations:
      - Natural-language times cover the phrases the first-party /remind command reads (in N minutes/hours/days/weeks/months/years, tomorrow, on a date, weekday or month and day, at a time, every day/week/month/year or weekday) in the zone of the member's notification schedule (UTC otherwise); other phrasings answer cannot_parse, and the recurrence object in responses is only the recurring flag.
      - Delivery shows the reminder in the member's Activity at the due instant; Slack posts it as a Slackbot direct message.
      - The current token-type-dependent rules for setting another user's reminder have not been differentially qualified.
