decisions:
  # The two Events-API sources above are pinned and hashed, and until this entry
  # existed no operation and no decision referenced either of them: every one of
  # the 205 operations carries provenance slack-api-specs-openapi or
  # slack-reference, all Web API methods. internal/events/payload.go says the
  # question of whether a topic's payload matches the event JSON real Slack
  # emits "is decided separately" and points here, so this is where it is
  # decided. It is decided against the claim.
  - method: events-api
    evidence: specs/upstream/slack-api-specs/events-api/slack_common_event_wrapper_schema.json
    decision: >-
      Event compatibility is topic-specific. A real service-created
      message.created record is hydrated into a Slack message only after
      installed-bot or connected-user conversation visibility is proved, and
      current Node, Python, and Java Socket Mode plus Node RTM clients parse that
      result. Message mutation and file create/share callbacks use immutable
      outbox snapshots; HTTP and Socket Mode select bot/user authorization
      perspectives by granted scope, membership, and manifest subscription.
      The formerly withheld topic-table rows are translated now:
      channel_created, im_created, channel_rename/group_rename,
      channel_archive/group_archive, channel_unarchive/group_unarchive,
      channel_deleted/group_deleted, emoji_changed, subteam_created,
      subteam_updated, subteam_members_changed, team_join, user_change with
      its current-catalog user_profile_changed and user_status_changed
      companions, dnd_updated, presence_change (RTM only), team_rename and
      file_public, each from a producer-snapshotted payload pinned by builder
      and producer-seam tests. user_typing is delivered on RTM and on the
      first-party SSE stream and is deliberately outside this translation
      table: it is the one Slack event produced without a journal record, read
      as expiring state rather than translated from the outbox, so it is never
      replayed to a reconnecting client and never reaches a webhook or Socket
      Mode. Its frames carry no event id for that reason. app_mention is derived by the per-app message
      projection for the app whose bot the text names, and app_installed is
      committed with the install's bot-token issuance, target-routed and
      automatic. Remaining recorded gaps: tokens_revoked (the revocation
      mutation reaches the token store directly across the auth seam, so the
      event must be owned by the store mutation), app_uninstalled (the
      app_installations join that scopes app event reads would hide the
      app's own announcement), dnd_updated_user (delivery does not vary the
      event name per recipient), Bolt callback qualifications still submit
      independently constructed signed callbacks, and no callback shape is
      live-Slack verified. The evidence therefore still does not promote the
      whole Events API surface.
  - method: rtm.connect
    evidence: https://docs.slack.dev/reference/methods/rtm.connect/
    decision: >-
      behavior-compatible covers this method's own response — it hands out a
      WebSocket URL and the self/team identity an official client needs to
      connect, and the official clients do connect with it. It does not extend
      to the events that arrive on that socket, which are governed by the
      events-api decision above. The same boundary applies to
      apps.connections.open.
  - method: apps.connections.open
    evidence: https://docs.slack.dev/reference/methods/apps.connections.open/
    decision: The current official method reference defines this Socket Mode method, while the pinned Web API OpenAPI snapshot does not contain it. Track the method against the official reference and the repository Socket Mode qualification.
  - method: functions.completeSuccess
    evidence: https://docs.slack.dev/reference/methods/functions.completeSuccess/
    decision: The current official method reference defines this POST method, but the pinned OpenAPI snapshot does not contain it. Track it as a supplemental Slack method until the vendored snapshot is refreshed.
  - method: functions.completeError
    evidence: https://docs.slack.dev/reference/methods/functions.completeError/
    decision: The current official method reference defines this POST method, but the pinned OpenAPI snapshot does not contain it. Track it as a supplemental Slack method until the vendored snapshot is refreshed.
  - method: slackLists
    evidence: https://docs.slack.dev/reference/methods/
    decision: The current official method reference defines the slackLists family, while the pinned Web API OpenAPI snapshot predates these methods. Track the family against the official reference until the vendored snapshot is refreshed.
  - method: entity
    evidence: https://docs.slack.dev/reference/methods/entity.presentDetails/
    decision: The current official method reference defines the entity Work Objects methods, while the pinned Web API OpenAPI snapshot predates them. Track these stateless response methods against the official references until the vendored snapshot is refreshed.
  - method: openid
    evidence: https://docs.slack.dev/reference/methods/openid.connect.token/
    decision: The current official method reference defines the Sign in with Slack OpenID Connect token and user-info methods, while the pinned Web API OpenAPI snapshot predates them. Track the methods against the official references and SDK qualifications until the vendored snapshot is refreshed.
