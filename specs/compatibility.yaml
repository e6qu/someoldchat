  - method: chat.postMessage
    status: schema-compatible
    provenance: slack-api-specs-openapi
    reference: https://docs.slack.dev/reference/methods/chat.postMessage/
    deviations:
      - >-
        The full current payload is validated and persisted, but link-name
        expansion and external media unfurl fetching have not been qualified
        against live Slack outcomes.
      - The Web API tier does not yet enforce Slack's per-method posting rate limits.
    audit:
      downgraded_from: behavior-compatible
      reason: >-
        The 2026-07-29 current-reference audit found that route registration and
        local message tests had been promoted as full method behavior despite
        unsupported documented arguments and rate-limit behavior.
      evidence:
        - internal/api/slack/handler.go
        - https://docs.slack.dev/reference/methods/chat.postMessage/
