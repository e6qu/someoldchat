  - method: users.getPresence
    status: sdk-compatible
    provenance: slack-api-specs-openapi
    reference: https://docs.slack.dev/reference/methods/users.getPresence/
    evidence:
      - official-sdk:tests/official-sdk-qualification/node-web-api/qualification.mjs
      - official-sdk:tests/official-sdk-qualification/python-slack-sdk/qualification.py
      - official-sdk:tests/official-sdk-qualification/java-slack-api/src/main/java/sameoldchat/qualification/Qualification.java
      - journey:specs/journeys/09-profile-presence-and-notifications.md
      - go-test:internal/api/slack:TestPresenceFollowsOpenClientsAndTheManualSetting
      - go-test:internal/service:TestPresenceChangesAnnounceWhatOthersSee
      - go-test:internal/realtime:TestAStreamIsAClientConnectionWhileItIsOpen
    deviations:
      - Presence follows Slack's rule - active only while at least one of the member's clients is connected and they are not away by choice or after ten minutes without activity; a bot user is active while connected. The clients are the web client's event stream and RTM sockets, each a lease its server renews every 20 seconds and that lapses 60 seconds after a server vanishes without closing it.
      - The caller's own presence carries online, auto_away, manual_away, connection_count (their open clients) and last_activity. presence_change is sent to RTM when a member's first client connects or last disconnects and when they choose away or automatic; a lease that lapses, and the ten-minute inactivity, change presence without announcing it.
    audit:
      downgraded_from: behavior-compatible
      reason: The previous claim proved response decoding but treated automatic mode as effective active presence without live activity evidence.
      evidence:
        - source:internal/api/slack/handler.go
        - source:internal/domain/models.go
        - https://docs.slack.dev/apis/web-api/user-presence-and-status/
  - method: users.setPresence
    status: sdk-compatible
    provenance: slack-api-specs-openapi
    reference: https://docs.slack.dev/reference/methods/users.setPresence/
    evidence:
      - official-sdk:tests/official-sdk-qualification/node-web-api/qualification.mjs
      - official-sdk:tests/official-sdk-qualification/python-slack-sdk/qualification.py
      - official-sdk:tests/official-sdk-qualification/java-slack-api/src/main/java/sameoldchat/qualification/Qualification.java
      - journey:specs/journeys/09-profile-presence-and-notifications.md
    deviations:
      - The documented `auto` and `away` values persist and round-trip; automatic presence is active while one of the member's clients is connected and they were active in the last ten minutes. The presence_change it announces carries active or away, never the setting `auto`.
      - Bot and user tokens with users:write are accepted, as the reference publishes.
    audit:
      downgraded_from: behavior-compatible
      reason: Local mode persistence and official SDK calls do not establish Slack's effective-presence lifecycle.
      evidence:
        - source:internal/api/slack/handler.go
        - source:internal/service/messages.go
        - https://docs.slack.dev/reference/methods/users.setPresence/
