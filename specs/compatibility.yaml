      - html and diff content is capped at 1,000,000 bytes (content_too_large); block_kit blocks are validated as message blocks (invalid_blocks); a canvas the agent cannot share is canvas_not_found, and access_level comment grants the channel read access, so the agent stays its only author.
      - The web client renders an html view in a frame sandboxed to an opaque origin, under a policy that allows inline script and loads from a curated CDN list (cdnjs, jsDelivr, unpkg and Google Fonts; Slack does not publish its own) plus resource_domains. connect_domains is validated (https only, never a private or internal host) and stored, but, as the SDK documents, not honored, so the view may not connect anywhere. A diff renders with added and removed lines marked, block_kit as read-only blocks, canvas and pull_request as links.
      - The method page could not be read from this deployment's network; arguments, bounds and response fields follow the official SDKs' declarations (@slack/web-api 8.2.0, slack_sdk 3.45.0, java-slack-sdk's samples), and refusals use the general Web API codes for each condition (invalid_arguments, not_in_channel, channel_not_found, not_allowed_token_type).
      - Slack Code is a partner beta on Slack. The app manifest's features.code_channels.enabled is accepted but not required; any app holding code_channels:manage may call the method.
    provenance: slack-reference
    reference: https://docs.slack.dev/reference/methods/agents.conversations.setView/
  - method: apps.managed.permissions.set
    status: schema-compatible
    provenance: slack-reference
    reference: https://docs.slack.dev/reference/methods/apps.managed.permissions.set/
    evidence:
      - go-test:internal/api/slack:TestAppsManagedPermissionsSetFollowsTheSlackReference
      - go-test:internal/modules/chat/transport/grpc:TestCompositionsAgreeOnEveryErrorClassAndValue
    deviations:
      - There is no manager-app or partner-platform model. Every app is created by its developer through apps.manifest.*, so no app is managed. After the configuration token, app_id and permissions are validated, an app the token's user owns answers app_not_managed and any other app answers app_not_found; app_not_owned_by_manager_app, app_owner_not_found, manager_app_not_eligible, enterprise_only_feature and feature_not_enabled are never emitted, and no success response (the stored or current permissions) is ever produced.
      - The reference's description speaks of a user token from the manager app while its token section names a configuration token with app_configurations:write; the method authenticates the configuration token, as apps.manifest.* does.
  - method: canvases.getContent
    status: schema-compatible
    provenance: slack-reference
    reference: https://docs.slack.dev/reference/methods/canvases.getContent/
    evidence:
      - go-test:internal/api/slack:TestCanvasesGetContentReturnsMarkdownAndHTML
      - go-test:internal/domain:TestCanvasDocumentMarkdownRoundTripsThroughTheCreateSplitter
      - go-test:internal/domain:TestCanvasDocumentMarkdownMatchesTheReferenceExample
      - go-test:internal/domain:TestCanvasDocumentHTMLUsesTheSharedRendererAndEscapesEverything
    deviations:
      - The reference does not show its HTML, so html is this deployment's rendering of the canvas (domain.CanvasDocumentHTML, the renderer the product's reading view uses), with a heading section as h1-h3, checklists as disabled checkboxes and a mention as a span naming the member id; it is not byte-compatible with Slack's HTML.
      - Markdown is the stored sections joined by blank lines, headings as "#" lines, which canvases.create reads back to the same sections; section kinds this deployment does not model beyond h1-h3 and markdown are returned as their text. A stored body that cannot be decoded answers internal_error. canvas_disabled_user_team is never returned because canvases cannot be disabled per workspace here.
  - method: oauth.v2.beginShortTokenRotation
    status: schema-compatible
    provenance: slack-reference
    reference: https://docs.slack.dev/reference/methods/oauth.v2.beginShortTokenRotation/
    evidence:
      - go-test:internal/api/slack:TestShortTokenRotationReplacesTheSecretOnlyWhenCompleted
      - go-test:internal/api/slack:TestShortTokenRotationAnswersEachDeclaredRefusal
      - go-test:internal/domain:TestShortSecretFollowsTheReferenceExamples
      - go-test:internal/domain:TestLengthenTokenSecretKeepsEverySectionButTheSecret
      - go-test:internal/store/sqlstore:TestSQLiteShortTokenRotation
      - go-test:internal/modules/chat/transport/grpc:TestCompositionsAgreeOnEveryErrorClassAndValue
    deviations:
      - This deployment did not exist before August 19, 2016 and keeps no token creation time, so eligibility is the test the reference gives for tokens of unknown age, a secret (the section after the final "-") shorter than 32 characters, and a token whose secret is 32 or longer answers token_too_long. The xoxp- tokens this deployment issues carry a 20-character hexadecimal secret, which that test calls short, so each of them may be rotated once to a 32-character secret; a token in Slack's pre-2016 sectioned form (xoxp-111-222-333-d6bc76) keeps its sections exactly as the reference describes.
      - Only a non-expiring user token beginning xoxp- is rotated; a bot, execution-scoped or expiring rotating (xoxe.xoxp-) token answers not_allowed_token_type. The token authenticates the request like any other (not_authed, invalid_auth, token_revoked, token_expired, account_inactive) before client_id and client_secret are checked; a token issued to another app answers invalid_client_id. Beginning again replaces the pending replacement.
  - method: oauth.v2.completeShortTokenRotation
    status: schema-compatible
    provenance: slack-reference
    reference: https://docs.slack.dev/reference/methods/oauth.v2.completeShortTokenRotation/
    evidence:
      - go-test:internal/api/slack:TestShortTokenRotationReplacesTheSecretOnlyWhenCompleted
      - go-test:internal/api/slack:TestShortTokenRotationAnswersEachDeclaredRefusal
      - go-test:internal/store/sqlstore:TestSQLiteShortTokenRotation
      - go-test:internal/store/memory:TestShortTokenRotation
      - go-test:internal/modules/chat/transport/grpc:TestCompositionsAgreeOnEveryErrorClassAndValue
    deviations:
      - The pending rotation is durable (schema 196) and completable for ten minutes; after that, or with nothing begun, the answer is rotation_not_found. A new_token other than the one begin issued answers invalid_token and a missing one invalid_arguments. Completion moves the original credential to the replacement's hash in one transaction, so the original answers invalid_auth afterwards rather than token_revoked, and no tokens_revoked event is sent for it. Eligibility and authentication follow oauth.v2.beginShortTokenRotation's recorded deviation.

decisions:
  # The two Events-API sources above are pinned and hashed, and until this entry
  # existed no operation and no decision referenced either of them: every one of
  # the 205 operations carries provenance slack-api-specs-openapi or
  # slack-reference, all Web API methods. internal/events/payload.go says the
  # question of whether a topic's payload matches the event JSON Slack
  # publishes "is decided separately" and points here, so this is where it is
  # decided. It is decided against the claim.
  - method: events-api
    evidence: specs/upstream/slack-api-specs/events-api/slack_common_event_wrapper_schema.json
    decision: >-
      Event compatibility is topic-specific. A real service-created
      message.created record is hydrated into a Slack message only after
      installed-bot or connected-user conversation visibility is proved, and
      current Node, Python, and Java Socket Mode plus Node and Python RTM clients
      parse that result. Message mutation and file create/share callbacks use immutable
      outbox snapshots; HTTP and Socket Mode select bot/user authorization
      perspectives by granted scope, membership, and manifest subscription.
      The formerly withheld topic-table rows are translated now:
      channel_created, im_created, channel_rename/group_rename,
      channel_archive/group_archive, channel_unarchive/group_unarchive,
      channel_deleted/group_deleted, emoji_changed, subteam_created,
      subteam_updated, subteam_members_changed, team_join, user_change with
      its current-catalog user_profile_changed and user_status_changed
      companions, dnd_updated, presence_change (RTM only), team_rename and
      file_public, each from a producer-snapshotted payload pinned by builder
      and producer-seam tests. user_guest_status_changed (current catalog,
      users:read, Events API and Socket Mode only) is minted by the store
      inside the mutation that ends a guest tier (admin.users.setRegular,
      setAdmin, setOwner and the admin page's role control) or deactivates
      an active guest (admin.users.remove, the admin page's Disable, guest
      expiry), with the user object as the change leaves it and cache_ts. The user object team_join and user_change carry
      is users.info's own (internal/slackobject), and every URL an event
      carries — a file's url_private, a user's image_* — is built on
      -auth-public-url at delivery, origin-relative when none is configured. user_typing is delivered on RTM and on the
      first-party SSE stream and is deliberately outside this translation
      table: it is the one Slack event produced without a journal record, read
      as expiring state rather than translated from the outbox, so it is never
      replayed to a reconnecting client and never reaches a webhook or Socket
      Mode. Its frames carry no event id for that reason. app_mention is derived by the per-app message
      projection for the app whose bot the text names, link_shared is
      journalled with the message (or edit) that shares new links and
      projected per app from its manifest unfurl_domains (subdomains match,
      at most five links, none inside code), links:read and channel
      visibility — any public channel, reported by is_bot_user_member —
      and app_installed is
      committed with the install's bot-token issuance, target-routed and
      automatic. Remaining recorded gaps: tokens_revoked (the revocation
      mutation reaches the token store directly across the auth seam, so the
      event must be owned by the store mutation), app_requested (a
      current-catalog event for admin apps whose app_request object the
      durable payload does not carry; no product path requests an app yet, so
      the mapping is withheld), app_uninstalled (the
      app_installations join that scopes app event reads would hide the
      app's own announcement), dnd_updated_user (delivery does not vary the
      event name per recipient), Bolt callback qualifications still submit
      independently constructed signed callbacks (the Node Bolt link_shared
      round trip excepted: a real post produces it), and no callback shape is
      yet asserted field by field against its published event reference and
      the pinned AsyncAPI schema. The evidence therefore still does not promote
      the whole Events API surface.
  - method: rtm.connect
    evidence: https://docs.slack.dev/reference/methods/rtm.connect/
    decision: >-
      behavior-compatible covers this method's own response — it hands out a
      WebSocket URL and the self/team identity an official client needs to
      connect, and the official clients do connect with it. It does not extend
      to the events that arrive on that socket, which are governed by the
      events-api decision above. The same boundary applies to
      apps.connections.open.
  - method: apps.connections.open
    evidence: https://docs.slack.dev/reference/methods/apps.connections.open/
    decision: >-
      The current official method reference defines this Socket Mode method,
      while the pinned Web API OpenAPI snapshot does not contain it. Track the
      method against the official reference and the repository Socket Mode
      qualification. The returned URL follows the origin the client called
      (X-Forwarded-Proto included) unless -socket-host overrides it. Slack
      documents no error code for an app already holding its ten connections;
      this server answers HTTP 429 with Retry-After and ratelimited, the one
      failure every official client retries on its own (python-slack-sdk's
      SocketModeClient retries this method only when error == "ratelimited"),
      rather than a code an SDK treats as permanent. On the socket, envelopes carry
      retry_attempt and retry_reason; an unacknowledged envelope is retried
      three times on Slack's Events API schedule (immediately, after one
      minute, after five minutes) and then dropped; interactions are delivered
      concurrently. Event delivery state is per record, so a record waiting
      for its retry does not hold back later ones and an app's connections
      lease different records at once, but each connection holds one event
      record in flight at a time — Slack delivers events concurrently on a
      connection, and that limit is a recorded deviation. A fanned-out record
      is retried only for the envelopes the app did not acknowledge.
  - method: functions.completeSuccess
    evidence: https://docs.slack.dev/reference/methods/functions.completeSuccess/
    decision: The current official method reference defines this POST method, but the pinned OpenAPI snapshot does not contain it. Track it as a supplemental Slack method until the vendored snapshot is refreshed.
  - method: functions.completeError
    evidence: https://docs.slack.dev/reference/methods/functions.completeError/
    decision: The current official method reference defines this POST method, but the pinned OpenAPI snapshot does not contain it. Track it as a supplemental Slack method until the vendored snapshot is refreshed.
  - method: slackLists
    evidence: https://docs.slack.dev/reference/methods/
    decision: The current official method reference defines the slackLists family, while the pinned Web API OpenAPI snapshot predates these methods. Track the family against the official reference until the vendored snapshot is refreshed.
  - method: entity
    evidence: https://docs.slack.dev/reference/methods/entity.presentDetails/
    decision: The current official method reference defines the entity Work Objects methods, while the pinned Web API OpenAPI snapshot predates them. Track these stateless response methods against the official references until the vendored snapshot is refreshed.
  - method: openid
    evidence: https://docs.slack.dev/reference/methods/openid.connect.token/
    decision: The current official method reference defines the Sign in with Slack OpenID Connect token and user-info methods, while the pinned Web API OpenAPI snapshot predates them. Track the methods against the official references and SDK qualifications until the vendored snapshot is refreshed.
  - method: rate-limit-tiers
    evidence: https://docs.slack.dev/apis/web-api/rate-limits/
    decision: >-
      Every Web API method's rate-limit tier is published: its reference page
      names it, and the pinned official Java SDK (slack-api-client 1.49.0,
      com.slack.api.methods.MethodsRateLimits) carries the same table, which
      that client uses to pace its own calls. The tier is therefore decided by
      the published sources; no observation of Slack is needed or planned.
      The table is vendored as specs/upstream/java-slack-sdk/methods-rate-limits.json
      (source java-slack-sdk-methods-rate-limits; make sdk-qualification
      re-derives it from the pinned jar), and internal/api/slack enforces each
      ledger method it lists at the tier it publishes
      (TestEveryLedgerMethodIsEnforcedAtItsPublishedTier fails on a ledger
      method without a tier source or a tier that disagrees with the table).
      The table's special tiers — auth.test and chat.getPermalink "hundreds
      of requests per minute", chat.postMessage "several hundred messages per
      minute" and assistant.threads.setStatus "similar" to it — are enforced
      as the 600 a minute the SDK paces them at, chat.postMessage's
      one-per-second-per-channel allowance on top; assistant.threads.setStatus's
      per-conversation allowance is not enforced separately, which is laxer
      than Slack and refuses no conforming client. Methods the pinned table
      predates take the tier their reference page names: 27 are cited
      (admin.usergroups.*, admin.apps.permissions.*, agents.*, among others).
      The other 43 (apps.datastore.*, blocks.validate, oauth.v2.user.access,
      the short-token rotation methods, entity.*, and other recent
      additions, listed as uncitedTierMethods) are held to Tier 4's floor,
      the laxest published tier, until their reference tier is cited: the
      reference pages are unreachable from the build network, and a tier
      written from memory could refuse a conforming client.
  - method: rate-limit-codes
    evidence: specs/upstream/slack-api-specs/web-api/slack_web_openapi_v2.json
    decision: >-
      A 429 carries one of two Slack codes, decided from primary evidence
      (docs.slack.dev is unreachable from the build network, so the evidence is
      the pinned artifacts). The pinned OpenAPI document declares rate_limited
      only for chat.postMessage, chat.meMessage, chat.scheduleMessage and
      chat.update, as the posting limit ("Application has posted too many
      messages"); the per-channel posting allowance answers it. A method's
      tier budget, and apps.connections.open's connection limit, answer
      ratelimited: python-slack-sdk 3.45.0 (sha256 recorded in
      specs/sdk-compatibility.yaml) waits out Retry-After and retries
      apps.connections.open (socket_mode/client.py, async_client.py) and
      rtm.connect (rtm_v2/__init__.py) only when error == "ratelimited" and
      raises on any other code, so rate_limited there crashed a Socket Mode app
      on a transient limit. Node and Java clients key on status 429 and
      Retry-After alone. Incoming webhooks answer in plain text and keep
      rate_limited, which no pinned client reads.
