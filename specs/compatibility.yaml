      - go-test:internal/service:TestAssistantWritesTouchOneFieldEach
      - go-test:internal/api/slack:TestAssistantThreadWritesAcceptTheSDKsJSONArrays
    deviations:
      - Prompts offered before anyone has typed. Bounded at eight, which Slack does not document; the pane is short and an unbounded list would be a different surface.
      - Argument names are taken from the pinned @slack/web-api type definitions; Slack publishes no per-method schema in the pinned reference, so the response body beyond {ok} is unqualified.
    provenance: slack-reference
    reference: https://docs.slack.dev/reference/methods/assistant.threads.setSuggestedPrompts/
