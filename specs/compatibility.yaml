  - method: users.list
    status: behavior-compatible
    provenance: slack-api-specs-openapi
    evidence:
      - go-test:internal/api/slack:TestUsersAndConversationsList
      - go-test:internal/api/slack:TestLimitZeroIsTheDefault
      - go-test:internal/api/slack:TestUserObjectCarriesRolesBotIdentityAndFetchableImages
    deviations:
      - tz is the zone the member's own browser last reported to the web client (Slack's automatic time zone); a member who has never used the web client reports tz UTC with a zero offset. tz_label is the zone's abbreviation (for example EDT) rather than Slack's long name.
      - A workspace has owners but no distinguished primary owner, so every owner reports is_primary_owner.
      - updated is recorded from schema 181 onward; a member whose record has not changed since reports 0.
  - method: users.lookupByEmail
    status: behavior-compatible
    provenance: slack-api-specs-openapi
    evidence:
      - go-test:internal/api/slack:TestLookupUserByEmail
    deviations:
      - >-
        A deactivated member is not found by e-mail (users_not_found), while
        users.info and users.list describe it with deleted:true. Whether
        Slack's lookupByEmail finds a deactivated account is not settled by
        the pinned material and could not be checked against the current
        reference from the build network; the address of a deactivated
        account is not treated as a live identity.
  - method: users.getPresence
    status: sdk-compatible
    provenance: slack-api-specs-openapi
    reference: https://docs.slack.dev/reference/methods/users.getPresence/
    evidence:
      - official-sdk:tests/official-sdk-qualification/node-web-api/qualification.mjs
      - official-sdk:tests/official-sdk-qualification/python-slack-sdk/qualification.py
      - official-sdk:tests/official-sdk-qualification/java-slack-api/src/main/java/sameoldchat/qualification/Qualification.java
      - journey:specs/journeys/09-profile-presence-and-notifications.md
    deviations:
      - Automatic presence follows Slack's ten-minute inactivity rule against the member's last observed activity; websocket connectivity does not feed it.
      - The caller's own presence carries online, auto_away, manual_away, connection_count and last_activity. Client connections are not tracked, so online and connection_count (0 or 1) follow observed activity rather than open connections.
      - Current rate-limit behavior has not been qualified against Slack.
    audit:
      downgraded_from: behavior-compatible
      reason: The previous claim proved response decoding but treated automatic mode as effective active presence without live activity evidence.
      evidence:
        - source:internal/api/slack/handler.go
        - source:internal/domain/models.go
        - https://docs.slack.dev/apis/web-api/user-presence-and-status/
  - method: users.setPresence
    status: sdk-compatible
    provenance: slack-api-specs-openapi
    reference: https://docs.slack.dev/reference/methods/users.setPresence/
    evidence:
      - official-sdk:tests/official-sdk-qualification/node-web-api/qualification.mjs
      - official-sdk:tests/official-sdk-qualification/python-slack-sdk/qualification.py
      - official-sdk:tests/official-sdk-qualification/java-slack-api/src/main/java/sameoldchat/qualification/Qualification.java
      - journey:specs/journeys/09-profile-presence-and-notifications.md
    deviations:
      - The documented `auto` and `away` values persist and round-trip; automatic presence follows client activity, and connection state does not feed it.
      - Current Slack rate-limit and token-type behavior has not been differentially qualified.
    audit:
      downgraded_from: behavior-compatible
      reason: Local mode persistence and official SDK calls do not establish Slack's effective-presence lifecycle.
      evidence:
        - source:internal/api/slack/handler.go
        - source:internal/service/messages.go
        - https://docs.slack.dev/reference/methods/users.setPresence/
  - method: users.profile.get
    status: sdk-compatible
    provenance: slack-api-specs-openapi
    reference: https://docs.slack.dev/reference/methods/users.profile.get/
    evidence:
      - official-sdk:tests/official-sdk-qualification/node-web-api/qualification.mjs
      - official-sdk:tests/official-sdk-qualification/python-slack-sdk/qualification.py
      - official-sdk:tests/official-sdk-qualification/java-slack-api/src/main/java/sameoldchat/qualification/Qualification.java
      - journey:specs/journeys/09-profile-presence-and-notifications.md
    deviations:
      - Core identity, image, status, expiration, and workspace-defined custom fields are returned; a hidden field is filtered from a reader who is neither its owner nor an administrator. Labels for the custom fields are read separately through team.profile.get.
      - Current rate limits and every user-token/bot-token visibility variation have not been differentially qualified.
    audit:
      downgraded_from: behavior-compatible
      reason: Custom fields are implemented and covered by tests, but rate limits and the full user-token/bot-token visibility contract are not differentially qualified.
      evidence:
        - source:internal/api/slack/handler.go
        - go-test:internal/api/slack:TestCustomProfileFieldsThroughTeamAndUserProfile
        - go-test:internal/api/slack:TestOAuthV2UserAccessReturnsUserGrantOnly
        - https://docs.slack.dev/reference/methods/users.profile.get/
  - method: users.profile.set
    status: sdk-compatible
    provenance: slack-api-specs-openapi
    reference: https://docs.slack.dev/reference/methods/users.profile.set/
    evidence:
      - official-sdk:tests/official-sdk-qualification/node-web-api/qualification.mjs
      - official-sdk:tests/official-sdk-qualification/python-slack-sdk/qualification.py
      - official-sdk:tests/official-sdk-qualification/java-slack-api/src/main/java/sameoldchat/qualification/Qualification.java
      - journey:specs/journeys/09-profile-presence-and-notifications.md
    deviations:
      - Display name, status, expiration, image URL, and workspace-defined custom fields are settable, both through the profile object's fields map and through the single-field name/value form (a standard field or a custom field id), each validated against its field's declared type. Title and pronouns are stored and settable through both forms. Standard Slack profile fields this deployment does not store (first/last/real name, phone, skype, start date, email) are refused rather than silently dropped.
      - Admin editing of another user, paid-plan restrictions, method-specific rate limits, and all token-type rules remain unqualified.
    audit:
      downgraded_from: behavior-compatible
      reason: The editable profile including custom fields and the name/value form is implemented and tested, but admin editing of another user, rate limits, and token-type rules are not qualified.
      evidence:
        - source:internal/api/slack/handler.go
        - go-test:internal/api/slack:TestUserProfileSetSingleFieldNameValueForm
        - go-test:internal/api/slack:TestCustomProfileFieldsThroughTeamAndUserProfile
        - source:internal/service/messages.go
        - https://docs.slack.dev/reference/methods/users.profile.set/

