    status: behavior-compatible
    provenance: slack-api-specs-openapi
    evidence:
      - go-test:internal/api/slack:TestFileMetadataEndpoints
      - go-test:internal/api/slack:TestFileURLsAreAbsoluteOnTheConfiguredPublicURL
      - go-test:internal/api/slack:TestFilesInfoCarriesTheRequiredCommentsArray
