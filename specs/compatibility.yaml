    status: schema-compatible
    provenance: slack-reference
    reference: https://docs.slack.dev/reference/methods/admin.apps.mcp.servers.list/
    evidence:
      - go-test:internal/api/slack:TestAdminAppsMCPServersFollowTheSlackReference
