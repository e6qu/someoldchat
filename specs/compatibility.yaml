      - go-test:internal/modules/chat/transport/grpc:TestCompositionsAgreeOnEveryErrorClassAndValue
    deviations:
      - The reference documents no response body. Servers are returned under mcp_servers as objects with id, app_id, name and url, with response_metadata.next_cursor; these names are a local decision until Slack publishes the shape.
      - Slack's manifest schema for declaring an MCP server is unpublished; servers are declared under features.mcp_servers with a unique name and an HTTPS url, and a server id is Amcp followed by a digest of the app id and name.
      - The organization's MCP server allowlist is the app approval decision, so the servers of approved, undeleted apps are listed.
      - feature_not_enabled is never emitted because the feature is always available.
      - Enterprise plan gating is not modelled, so not_an_enterprise and enterprise_is_restricted are never emitted, and the list is kept per workspace rather than per Enterprise organization.
