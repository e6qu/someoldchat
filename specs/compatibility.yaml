  - method: search.messages
    status: sdk-compatible
    provenance: slack-api-specs-openapi
    reference: https://docs.slack.dev/reference/methods/search.messages/
    evidence:
      - tests/official-sdk-qualification/node-web-api/qualification.mjs
      - tests/official-sdk-qualification/python-slack-sdk/qualification.py
      - tests/official-sdk-qualification/java-slack-api/src/main/java/sameoldchat/qualification/Qualification.java
      - specs/journeys/05-search-and-activity.md
    deviations:
      - Relevance scoring is deterministic but has not been compared with Slack's ranking model.
      - Highlight markers, every reaction-specific modifier, and live indexing-delay behavior remain unqualified.
    audit:
      downgraded_from: behavior-compatible
      reason: The previous claim covered substring matching and response decoding, not Slack's current modifier, token-type, sorting, ranking, and highlighting behavior.
      evidence:
        - https://docs.slack.dev/reference/methods/search.messages/
        - internal/api/slack/handler.go
