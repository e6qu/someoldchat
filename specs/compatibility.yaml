  - method: users.profile.set
    status: sdk-compatible
    provenance: slack-api-specs-openapi
    reference: https://docs.slack.dev/reference/methods/users.profile.set/
    evidence:
      - official-sdk:tests/official-sdk-qualification/node-web-api/qualification.mjs
      - official-sdk:tests/official-sdk-qualification/python-slack-sdk/qualification.py
      - official-sdk:tests/official-sdk-qualification/java-slack-api/src/main/java/sameoldchat/qualification/Qualification.java
      - journey:specs/journeys/09-profile-presence-and-notifications.md
    deviations:
      - Display name, full name (real_name, first_name, last_name), phone, title, pronouns, status, expiration, image URL, and workspace-defined custom fields are settable through both the profile object and the single-field name/value form. real_name sets both parts, split at its first space, and a full name cannot be cleared. Standard Slack profile fields this deployment does not store (skype, start date) and email, which only an administrator may change in Slack, are refused rather than silently dropped.
      - Admin editing of another user (the reference's user argument) and the reference's token-type rules are not yet asserted; this deployment has no plan tiers, so the paid-team restriction on user is not applied.
    audit:
      downgraded_from: behavior-compatible
      reason: The editable profile including custom fields and the name/value form is implemented and tested, but admin editing of another user, rate limits, and token-type rules are not qualified.
      evidence:
        - source:internal/api/slack/handler.go
        - go-test:internal/api/slack:TestUserProfileSetSingleFieldNameValueForm
        - go-test:internal/api/slack:TestCustomProfileFieldsThroughTeamAndUserProfile
        - source:internal/service/messages.go
        - https://docs.slack.dev/reference/methods/users.profile.set/

