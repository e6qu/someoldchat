version: 1
project: sameoldchat

# This ledger is intentionally fail-closed: no compatibility claim is valid
# until the source has an immutable revision and independently recorded
# integrity evidence.
#
# Every `evidence:` entry names a target that contractcheck resolves, and the
# gate fails when one does not exist. The kinds are:
#
#   go-test:<package>:<FuncName>   a Go test, or a cross-profile contract
#                                  function driven by a table-driven runner
#   browser-journey:<JOURNEY-ID>   a journey the Playwright suite really cites
#   official-sdk:<path>            a walk in a pinned official SDK, under
#                                  tests/official-sdk-qualification/
#   external-contract:<path>       the pinned third-party contract walk
#   persistence:<path>             a cross-profile persistence contract file
#   journey:<path>                 a document under specs/journeys/
#   https://…                      an official Slack source (slack.com,
#                                  api.slack.com or docs.slack.dev)
#
# `source:<path>` cites implementation and is admissible only inside a
# downgrade audit, where the correction being recorded is a statement about the
# code. As operation evidence it would let a method prove itself with the thing
# being judged.
#
# Resolving a target is not the same as proving a claim: no gate can read a
# test and decide whether it establishes a Slack contract. This closes the
# mechanical half — deletions, renames, moves, mislabelled kinds — and leaves
# the judgement to review.
