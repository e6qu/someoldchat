      - go-test:internal/service:TestSearchTrailingWildcardIsAPrefix
    deviations:
      - Relevance scoring is deterministic but has not been compared with Slack's ranking model.
      - Highlight markers wrap case-insensitive occurrences of each free-text term in message text only; attachment and block text are not marked.
      - Relative dates resolve in the searcher's profile time zone (reported by their browser), else the zone of their notification schedule, and in UTC when there is neither.
      - Every reaction-specific modifier and live indexing-delay behavior remain unqualified.
    audit:
      downgraded_from: behavior-compatible
      reason: The previous claim covered substring matching and response decoding, not Slack's current modifier, token-type, sorting, ranking, and highlighting behavior.
      evidence:
        - https://docs.slack.dev/reference/methods/search.messages/
