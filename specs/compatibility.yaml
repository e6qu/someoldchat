    reference: https://docs.slack.dev/reference/methods/admin.conversations.bulkSetProperties/
    evidence:
      - go-test:internal/api/slack:TestAdminConversationsBulkSetPropertiesSetsTheChannelsThatExist
      - go-test:internal/domain:TestParseConversationPropertyUsesTheReferenceCodes
      - go-test:internal/store/sqlstore:TestSQLiteExistingConversationsExcludedFromAI
      - go-test:internal/store/memory:TestExistingConversationsExcludedFromAI
      - go-test:internal/modules/chat/transport/grpc:TestCompositionsAgreeOnEveryErrorClassAndValue
    deviations:
      - The reference names exclude_from_slack_ai only as its example and lists no other property, so that is the one property accepted (the flag admin.conversations.bulkSetExcludeFromSlackAi writes); every other key answers property_not_allowed, and a value that is not a JSON boolean answers invalid_arguments.
      - The reference documents no response body and reserves no_valid_channels for a request whose channels are all invalid, so the channels of the workspace are set, the others are skipped in the same transaction, and a successful request answers only {"ok":true}; which channels were skipped is not reported. An invalid channel is one that is not a conversation of the caller's workspace; the property applies to every conversation type here, so disallowed_action is never returned.
      - The change is applied synchronously in one transaction, so action_already_in_progress is never returned; feature_not_enabled and restricted_plan_level are never returned because this deployment has no plan tiers. A non-administrator answers restricted_action and a bot token not_allowed_token_type. Enterprise organization behavior and live-Slack outcomes remain unqualified.
  - method: admin.usergroups.addUsers
    status: schema-compatible
    provenance: slack-reference
    reference: https://docs.slack.dev/reference/methods/admin.usergroups.addUsers/
    evidence:
      - go-test:internal/api/slack:TestAdminUserGroupsAddRemoveAndUploadUsers
      - go-test:internal/api/slack:TestAdminUserGroupsRefuseBotTokensAndMembers
      - go-test:internal/service:TestAdminAddUserGroupUsersAddsMembersAndListsTheRefused
      - go-test:internal/store/sqlstore:TestSQLiteOrganizationUserGroups
      - go-test:internal/modules/chat/transport/grpc:TestCompositionsAgreeOnEveryErrorClassAndValue
    deviations:
      - 'This deployment has no Enterprise Grid organization above its workspace: the organization is the single workspace, so team_id and enterprise_id both name it and an organization administrator is that workspace''s administrator or owner. The Enterprise and platform conditions behind not_an_enterprise, enterprise_is_restricted, feature_not_enabled, team_access_not_granted, org_login_required, team_added_to_org, ekm_access_denied, two_factor_setup_required, accesslimited, deprecated_endpoint and method_deprecated never arise, so those codes are never emitted.'
      - 'No group here is managed by an identity provider (is_idp_group is always false), so the SCIM-managed branch of restricted_action never arises; restricted_action is the answer to a caller who is not an administrator.'
      - 'Slack does not document the member limit for a visible group, so it is not enforced: member_count_would_exceed_visible_limit is never emitted.'
      - 'There are no role-assignment groups, so cannot_modify_role_admin is never emitted.'
      - 'The reference does not say which users are listed in invalid_users and which fail the call. Here a user who is not an active member of the organization (unknown, deactivated, or of another workspace) fails the whole call with user_not_found and changes nothing; a guest is listed with reason guest_user while the others are added; a call in which every user is a guest is invalid_users.'
      - 'users is accepted as a comma-separated string, a JSON-encoded array string, or a JSON array in a JSON body; more than 15000 users or none is invalid_arguments.'
      - 'The documented rate-limit tier is not enforced per method beyond the Web API''s uniform per-method budget.'
