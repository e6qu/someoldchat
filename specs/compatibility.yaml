  - method: reminders.add
    status: sdk-compatible
    provenance: slack-api-specs-openapi
    reference: https://docs.slack.dev/reference/methods/reminders.add/
    evidence:
      - tests/official-sdk-qualification/node-web-api/qualification.mjs
      - tests/official-sdk-qualification/python-slack-sdk/qualification.py
      - tests/official-sdk-qualification/java-slack-api/src/main/java/sameoldchat/qualification/Qualification.java
    deviations:
      - Natural-language time descriptions and the recurrence object are not implemented.
      - Reminder delivery is not implemented, so creating a durable row does not yet produce Slack's notification.
      - The current token-type-dependent rules for setting another user's reminder have not been differentially qualified.
    audit:
      downgraded_from: behavior-compatible
      reason: The prior level inferred Slack behavior from local CRUD tests even though current documented parsing, recurrence, targeting, retirement, and delivery contracts were not implemented or observed.
      evidence:
        - specs/journeys/06-later-and-reminders.md
        - internal/api/slack/error_contract_test.go
        - tests/official-sdk-qualification/node-web-api/qualification.mjs
