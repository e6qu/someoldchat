syntax = "proto3";

package sameoldchat.chat.v1;

option go_package = "github.com/sameoldchat/sameoldchat/internal/modules/chat/transport/grpc/gen/sameoldchat/chat/v1;chatv1";

// MessageAt returns a Message, which this package defines.
import "sameoldchat/chat/v1/messages.proto";

message ReadCursor {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string last_read = 4;
  string updated_at = 5;
}

message MarkReadRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string timestamp = 4;
}

message MarkAllReadRequest {
  string workspace_id = 1;
  string user_id = 2;
}

message MarkAllReadResponse {
  int32 conversations = 1;
}

message ResumeWorkflowDelaysRequest {
  string workspace_id = 1;
  int64 now_unix_nano = 2;
  int32 limit = 3;
}

message ResumeWorkflowDelaysResponse {
  int32 resumed = 1;
}

message AssistantPrompt {
  string title = 1;
  string message = 2;
}

message AssistantThread {
  string workspace_id = 1;
  string conversation = 2;
  string thread_ts = 3;
  string title = 4;
  string status = 5;
  string prompts_title = 6;
  repeated AssistantPrompt prompts = 7;
  int64 updated_at_unix_nano = 8;
}

message SetAssistantThreadRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation = 3;
  string thread_ts = 4;
  string field = 5;
  string title = 6;
  string status = 7;
  string prompts_title = 8;
  repeated AssistantPrompt prompts = 9;
}

message SetAssistantThreadResponse {
  bool ok = 1;
}

message AssistantThreadRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation = 3;
  string thread_ts = 4;
}

message TypingSignal {
  string workspace_id = 1;
  string conversation = 2;
  string user_id = 3;
  int64 expires_at_unix_nano = 4;
}

message SetTypingRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation = 3;
}

message SetTypingResponse {
  bool ok = 1;
}

message TypingSignalsRequest {
  string workspace_id = 1;
  string user_id = 2;
}

message TypingSignalsResponse {
  repeated TypingSignal signals = 1;
}

message RecordActivityRequest {
  string workspace_id = 1;
  string user_id = 2;
}

message RecordActivityResponse {
  bool ok = 1;
}

message FollowedThreadsRequest {
  string workspace_id = 1;
  string user_id = 2;
  int32 limit = 3;
  string cursor = 4;
}

message FollowedThread {
  string conversation = 1;
  string conversation_name = 2;
  string root = 3;
  string root_text = 4;
  string root_author_id = 5;
  int32 reply_count = 6;
  int32 unread_replies = 7;
  int64 last_reply_at_unix_nano = 8;
}

message FollowedThreadPage {
  repeated FollowedThread threads = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message ReadCursorRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
}

message MessageAtRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string timestamp = 4;
}

message ThreadSummariesRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  repeated string thread_timestamps = 4;
}

// ThreadSummary reports what one thread root has accumulated.
message ThreadSummary {
  int32 reply_count = 1;
  repeated string participants = 2;
  string last_reply_at = 3;
}

message ThreadSummariesResponse {
  map<string, ThreadSummary> summaries = 1;
}

message SlashCommandRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string thread_timestamp = 4;
  string command = 5;
  string text = 6;
  string response_base_url = 7;
}

message BlockActionRequest {
  string workspace_id = 1;
  string user_id = 2;
  string message_id = 3;
  string block_id = 4;
  string action_id = 5;
  string action_type = 6;
  string value = 7;
  string response_base_url = 8;
}

message ViewBlockActionRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string view_id = 4;
  string block_id = 5;
  string action_id = 6;
  string action_type = 7;
  string value = 8;
  string state_json = 9;
  string response_base_url = 10;
}

message AppOptionQueryRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string app_id = 4;
  string message_id = 5;
  string view_id = 6;
  string block_id = 7;
  string action_id = 8;
  string value = 9;
  string response_base_url = 10;
}

message AppOption {
  string text = 1;
  string value = 2;
  string description = 3;
  string group = 4;
}

message AppOptionListResponse {
  repeated AppOption options = 1;
}

message AppResponseRequest {
  string token = 1;
  string payload = 2;
}

message AppShortcut {
  string app_id = 1;
  string app_name = 2;
  string name = 3;
  string callback_id = 4;
  string description = 5;
  string type = 6;
  string command = 7;
  string usage_hint = 8;
  bool should_escape = 9;
}

message AppShortcutListRequest {
  string workspace_id = 1;
  string user_id = 2;
  string type = 3;
}

message AppShortcutListResponse {
  repeated AppShortcut shortcuts = 1;
}

message AppShortcutDispatchRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string app_id = 4;
  string callback_id = 5;
  string message_id = 6;
  string response_base_url = 7;
}

message InteractionMutationResponse {
  bool ok = 1;
}

message SocketModeInteraction {
  string envelope_id = 1;
  string app_id = 2;
  string workspace_id = 3;
  string user_id = 4;
  string type = 5;
  string payload = 6;
  string response_token_hash = 7;
  string response_conversation_id = 8;
  string response_original_message_id = 9;
  string response_thread_timestamp = 10;
  string response_created_at = 11;
  string response_expires_at = 12;
  int32 response_uses_remaining = 13;
  string created_at = 14;
  int32 retry_count = 15;
  string retry_reason = 16;
  bool found = 17;
  string lease_owner = 18;
  string lease_expires_at = 19;
  string retry_at = 20;
  string acknowledged_at = 21;
  string response_app_id = 22;
  string response_workspace_id = 23;
  string response_user_id = 24;
}

message SocketModeInteractionClaimRequest {
  string app_id = 1;
  string owner = 2;
  int64 lease_nanos = 3;
}

message SocketModeInteractionAckRequest {
  string app_id = 1;
  string envelope_id = 2;
  string owner = 3;
}

message SocketModeInteractionReleaseRequest {
  string app_id = 1;
  string envelope_id = 2;
  string owner = 3;
  string reason = 4;
  string retry_at = 5;
}

message SocketModeInteractionResponseRequest {
  string app_id = 1;
  string envelope_id = 2;
  bytes payload = 3;
}

service InteractionsService {
  rpc MarkRead(MarkReadRequest) returns (ReadCursor);
  rpc MarkAllRead(MarkAllReadRequest) returns (MarkAllReadResponse);
  rpc ListFollowedThreads(FollowedThreadsRequest) returns (FollowedThreadPage);
  rpc RecordActivity(RecordActivityRequest) returns (RecordActivityResponse);
  rpc ResumeWorkflowDelays(ResumeWorkflowDelaysRequest) returns (ResumeWorkflowDelaysResponse);
  rpc SetAssistantThread(SetAssistantThreadRequest) returns (SetAssistantThreadResponse);
  rpc GetAssistantThread(AssistantThreadRequest) returns (AssistantThread);
  rpc SetTyping(SetTypingRequest) returns (SetTypingResponse);
  rpc TypingSignals(TypingSignalsRequest) returns (TypingSignalsResponse);
  // Named GetReadCursor because an rpc named ReadCursor would shadow the
  // ReadCursor message type for every later return in this service.
  rpc GetReadCursor(ReadCursorRequest) returns (ReadCursor);
  rpc ThreadSummaries(ThreadSummariesRequest) returns (ThreadSummariesResponse);
  rpc MessageAt(MessageAtRequest) returns (Message);
  rpc DispatchSlashCommand(SlashCommandRequest) returns (InteractionMutationResponse);
  rpc DispatchBlockAction(BlockActionRequest) returns (InteractionMutationResponse);
  rpc DispatchViewBlockAction(ViewBlockActionRequest) returns (InteractionMutationResponse);
  rpc LoadAppOptions(AppOptionQueryRequest) returns (AppOptionListResponse);
  rpc ListAppShortcuts(AppShortcutListRequest) returns (AppShortcutListResponse);
  rpc DispatchAppShortcut(AppShortcutDispatchRequest) returns (InteractionMutationResponse);
  rpc HandleAppResponse(AppResponseRequest) returns (InteractionMutationResponse);
  rpc ClaimSocketModeInteraction(SocketModeInteractionClaimRequest) returns (SocketModeInteraction);
  rpc AckSocketModeInteraction(SocketModeInteractionAckRequest) returns (InteractionMutationResponse);
  rpc ReleaseSocketModeInteraction(SocketModeInteractionReleaseRequest) returns (InteractionMutationResponse);
  rpc HandleSocketModeResponse(SocketModeInteractionResponseRequest) returns (InteractionMutationResponse);
}
