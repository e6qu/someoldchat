syntax = "proto3";

package sameoldchat.chat.v1;

option go_package = "github.com/sameoldchat/sameoldchat/internal/modules/chat/transport/grpc/gen/sameoldchat/chat/v1;chatv1";

import "sameoldchat/chat/v1/conversation_mutations.proto";
import "sameoldchat/chat/v1/messages.proto";

message ScheduledMessage {
  string workspace_id = 1;
  string id = 2;
  string channel_id = 3;
  string author_id = 4;
  string text = 5;
  int64 post_at = 6;
  int64 created_at = 7;
  string blocks = 8;
  string attachments = 9;
  string app_id = 10;
  string bot_id = 11;
  string credential_hash = 12;
  string thread_ts = 13;
  int64 delivered_at = 14;
  int64 failed_at = 15;
  string failure_code = 16;
  string metadata = 17;
  string stream_state = 18;
}

message ScheduleMessageRequest {
  string workspace_id = 1;
  string user_id = 2;
  string channel_id = 3;
  string text = 4;
  int64 post_at = 5;
  string blocks = 6;
  string attachments = 7;
  string app_id = 8;
  string bot_id = 9;
  string credential_hash = 10;
  string thread_ts = 11;
  string metadata = 12;
  string stream_state = 13;
}

message ScheduledMessagesRequest {
  string workspace_id = 1;
  string user_id = 2;
  string channel_id = 3;
  int32 limit = 4;
  string cursor = 5;
  string credential_hash = 6;
  int64 oldest = 7;
  int64 latest = 8;
}

message DeleteScheduledMessageRequest {
  string workspace_id = 1;
  string user_id = 2;
  string channel_id = 3;
  string scheduled_message_id = 4;
  string credential_hash = 5;
}

message ScheduledMessageHistoryRequest {
  string workspace_id = 1;
  string user_id = 2;
  int32 limit = 3;
  string cursor = 4;
  bool descending = 5;
  bool include_delivered = 6;
}

message UpdateScheduledMessageRequest {
  string workspace_id = 1;
  string user_id = 2;
  string scheduled_message_id = 3;
  string channel_id = 4;
  string text = 5;
  int64 post_at = 6;
}

message SendScheduledMessageNowRequest {
  string workspace_id = 1;
  string user_id = 2;
  string scheduled_message_id = 3;
}

message ScheduledMessagePage {
  repeated ScheduledMessage scheduled_messages = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message Draft {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string thread_ts = 4;
  string text = 5;
  int64 updated_at_unix_nano = 6;
  repeated DraftAttachment attachments = 7;
}

message DraftAttachment {
  string upload_id = 1;
  string name = 2;
  string title = 3;
  string mime_type = 4;
  int64 size = 5;
}

message DraftRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string thread_ts = 4;
  string text = 5;
  repeated DraftAttachment attachments = 6;
}

message DraftsRequest {
  string workspace_id = 1;
  string user_id = 2;
  int32 limit = 3;
  string cursor = 4;
  bool descending = 5;
}

message DraftPage {
  repeated Draft drafts = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message SentMessagesRequest {
  string workspace_id = 1;
  string user_id = 2;
  int32 limit = 3;
  string cursor = 4;
  bool descending = 5;
}

service ScheduledMessagesService {
  rpc ScheduleMessage(ScheduleMessageRequest) returns (ScheduledMessage);
  rpc ScheduledMessages(ScheduledMessagesRequest) returns (ScheduledMessagePage);
  rpc ScheduledMessageHistory(ScheduledMessageHistoryRequest) returns (ScheduledMessagePage);
  rpc UpdateScheduledMessage(UpdateScheduledMessageRequest) returns (ScheduledMessage);
  rpc SendScheduledMessageNow(SendScheduledMessageNowRequest) returns (Message);
  rpc DeleteScheduledMessage(DeleteScheduledMessageRequest) returns (MutationResponse);
  rpc SaveDraft(DraftRequest) returns (Draft);
  rpc GetDraft(DraftRequest) returns (Draft);
  rpc Drafts(DraftsRequest) returns (DraftPage);
  rpc DeleteDraft(DraftRequest) returns (MutationResponse);
  rpc SentMessages(SentMessagesRequest) returns (MessagePage);
}
