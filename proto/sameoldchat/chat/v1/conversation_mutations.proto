syntax = "proto3";

package sameoldchat.chat.v1;

option go_package = "github.com/sameoldchat/sameoldchat/internal/modules/chat/transport/grpc/gen/sameoldchat/chat/v1;chatv1";

import "sameoldchat/chat/v1/conversations.proto";

message OpenConversationRequest {
  string workspace_id = 1;
  string user_id = 2;
  repeated string users = 3;
}

message AddPeopleToDirectConversationRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  repeated string users = 4;
  string history = 5;
}

message ConvertGroupDirectToPrivateRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string name = 4;
}

message CreateConversationRequest {
  string workspace_id = 1;
  string user_id = 2;
  string name = 3;
  bool private = 4;
}

message ConversationRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
}

message InviteConversationMembersRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  repeated string users = 4;
}

message KickConversationMemberRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string target_id = 4;
}

message MutationResponse {
  bool ok = 1;
}

message RenameConversationRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string name = 4;
}

message SetConversationTopicRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string topic = 4;
}

message SetConversationPurposeRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string purpose = 4;
}

message SetConversationArchivedRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  bool archived = 4;
}

message DeleteConversationRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
}

message ConversationAccessGroupRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string group_id = 4;
}

message ConversationAccessGroupsResponse {
  repeated string group_ids = 1;
}

message BulkConversationsRequest {
  string workspace_id = 1;
  string user_id = 2;
  repeated string conversation_ids = 3;
}

message ConvertConversationToPrivateRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
}

message AdminConversationTeamsRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  int32 limit = 4;
  string cursor = 5;
  repeated string team_ids = 6;
  bool org_channel = 7;
}

message AdminConversationTeamsResponse {
  repeated string team_ids = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message LinkedObject {
  string conversation_id = 1;
  string workspace_id = 2;
  string org_id = 3;
  string record_id = 4;
  int64 created_at = 5;
}

message ConversationLookupRequest {
  string workspace_id = 1;
  string user_id = 2;
  repeated string team_ids = 3;
  int64 last_message_activity_before = 4;
  int32 max_member_count = 5;
  int32 limit = 6;
  string cursor = 7;
}

message BulkMoveConversationsRequest {
  string workspace_id = 1;
  string user_id = 2;
  repeated string conversation_ids = 3;
  string target_team_id = 4;
}

message ConversationAIExclusionRequest {
  string workspace_id = 1;
  string user_id = 2;
  repeated string conversation_ids = 3;
  bool excluded = 4;
}

message ConversationAIExclusionResponse {
  repeated string conversation_ids = 1;
}

message LinkConversationObjectsRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string org_id = 4;
  repeated string record_ids = 5;
}

message UnlinkConversationObjectsRequest {
  string workspace_id = 1;
  string user_id = 2;
  repeated string conversation_ids = 3;
}

message ConversationObjectsRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
}

message ConversationObjectsResponse {
  repeated LinkedObject objects = 1;
}

message CreateConversationForObjectsRequest {
  string workspace_id = 1;
  string user_id = 2;
  string name = 3;
  string org_id = 4;
  string record_id = 5;
  bool is_private = 6;
}

service ConversationMutationsService {
  rpc AdminLookupConversations(ConversationLookupRequest) returns (ConversationPage);
  rpc AdminBulkMoveConversations(BulkMoveConversationsRequest) returns (MutationResponse);
  rpc AdminSetConversationsExcludedFromAI(ConversationAIExclusionRequest) returns (MutationResponse);
  rpc AdminConversationsExcludedFromAI(ConversationAIExclusionRequest) returns (ConversationAIExclusionResponse);
  rpc AdminLinkConversationObjects(LinkConversationObjectsRequest) returns (MutationResponse);
  rpc AdminUnlinkConversationObjects(UnlinkConversationObjectsRequest) returns (MutationResponse);
  rpc AdminConversationObjects(ConversationObjectsRequest) returns (ConversationObjectsResponse);
  rpc AdminCreateConversationForObjects(CreateConversationForObjectsRequest) returns (Conversation);
  rpc OpenConversation(OpenConversationRequest) returns (Conversation);
  rpc AddPeopleToDirectConversation(AddPeopleToDirectConversationRequest) returns (Conversation);
  rpc ConvertGroupDirectToPrivate(ConvertGroupDirectToPrivateRequest) returns (Conversation);
  rpc CreateConversation(CreateConversationRequest) returns (Conversation);
  rpc JoinConversation(ConversationRequest) returns (Conversation);
  rpc InviteConversationMembers(InviteConversationMembersRequest) returns (Conversation);
  rpc LeaveConversation(ConversationRequest) returns (MutationResponse);
  rpc KickConversationMember(KickConversationMemberRequest) returns (MutationResponse);
  rpc RenameConversation(RenameConversationRequest) returns (Conversation);
  rpc SetConversationTopic(SetConversationTopicRequest) returns (Conversation);
  rpc SetConversationPurpose(SetConversationPurposeRequest) returns (Conversation);
  rpc SetConversationArchived(SetConversationArchivedRequest) returns (Conversation);
  rpc AdminRenameConversation(RenameConversationRequest) returns (Conversation);
  rpc AdminSetConversationArchived(SetConversationArchivedRequest) returns (Conversation);
  rpc AdminDeleteConversation(DeleteConversationRequest) returns (MutationResponse);
  rpc AdminAddConversationAccessGroup(ConversationAccessGroupRequest) returns (MutationResponse);
  rpc AdminRemoveConversationAccessGroup(ConversationAccessGroupRequest) returns (MutationResponse);
  rpc AdminListConversationAccessGroups(ConversationRequest) returns (ConversationAccessGroupsResponse);
  rpc AdminInviteConversationMembers(InviteConversationMembersRequest) returns (Conversation);
  rpc AdminConvertConversationToPrivate(ConvertConversationToPrivateRequest) returns (Conversation);
  rpc AdminConvertConversationToPublic(ConvertConversationToPrivateRequest) returns (Conversation);
  rpc AdminBulkArchiveConversations(BulkConversationsRequest) returns (MutationResponse);
  rpc AdminBulkDeleteConversations(BulkConversationsRequest) returns (MutationResponse);
  rpc AdminConversationTeams(AdminConversationTeamsRequest) returns (AdminConversationTeamsResponse);
  rpc AdminSetConversationTeams(AdminConversationTeamsRequest) returns (MutationResponse);
}
