syntax = "proto3";

package sameoldchat.chat.v1;

option go_package = "github.com/sameoldchat/sameoldchat/internal/modules/chat/transport/grpc/gen/sameoldchat/chat/v1;chatv1";

message OAuthExchangeRequest {
  string client_id = 1;
  string client_secret = 2;
  string code = 3;
  string redirect_uri = 4;
  bool user_only = 5;
  string refresh_token = 6;
  string token = 7;
}

message OAuthToken {
  string access_token = 1;
  string client_id = 2;
  string app_id = 3;
  string workspace_id = 4;
  string user_id = 5;
  repeated string scopes = 6;
  string token_type = 7;
  string installer_id = 8;
  string bot_id = 9;
  string authed_user_access_token = 10;
  repeated string authed_user_scopes = 11;
  string refresh_token = 12;
  int64 expires_at_unix_nano = 13;
  string authed_user_refresh_token = 14;
  int64 authed_user_expires_at_unix_nano = 15;
  string incoming_webhook_channel = 16;
  string incoming_webhook_channel_name = 17;
  string incoming_webhook_id = 18;
  // Despite the historical field names, both carry paths relative to the
  // deployment's public base URL; the HTTP boundary makes them absolute. An
  // older chat process may still send an absolute URL, which passes through.
  string incoming_webhook_url = 19;
  string incoming_webhook_config_url = 20;
  string workspace_name = 21;
}

message OpenIDConnectTokenRequest {
  string client_id = 1;
  string client_secret = 2;
  string code = 3;
  string redirect_uri = 4;
  string grant_type = 5;
  string refresh_token = 6;
  string code_verifier = 7;
}

message OpenIDConnectTokenResponse {
  OAuthToken oauth_token = 1;
  string id_token = 2;
  string refresh_token = 3;
}

// OpenIDKey is one public key of the set Sign in with Slack ID tokens are
// signed with: an RSA key by its id, modulus and exponent, each base64url
// encoded as a JSON Web Key carries them.
message OpenIDKey {
  string key_id = 1;
  string modulus = 2;
  string exponent = 3;
}

message OpenIDKeysRequest {}

message OpenIDKeysResponse {
  repeated OpenIDKey keys = 1;
}

message OpenIDConnectUserInfoRequest {
  string token = 1;
}

message OpenIDConnectUserInfoResponse {
  string subject = 1;
  string user_id = 2;
  string workspace_id = 3;
  string email = 4;
  bool email_verified = 5;
  int64 date_email_verified = 6;
  string name = 7;
  string given_name = 8;
  string family_name = 9;
  string locale = 10;
  string picture = 11;
  string team_name = 12;
  string team_domain = 13;
  map<string, string> user_images = 14;
  map<string, string> team_images = 15;
  bool team_image_default = 16;
}

// ShortTokenRotationRequest is oauth.v2.beginShortTokenRotation (new_token
// empty) and oauth.v2.completeShortTokenRotation.
message ShortTokenRotationRequest {
  string client_id = 1;
  string client_secret = 2;
  string token = 3;
  string new_token = 4;
}

// ShortTokenRotationResponse carries the replacement token: the pending one
// from a begin, the now-live one from a completion.
message ShortTokenRotationResponse {
  string token = 1;
}

service OAuthService {
  rpc ExchangeOAuth(OAuthExchangeRequest) returns (OAuthToken);
  rpc ExchangeOAuthV2(OAuthExchangeRequest) returns (OAuthToken);
  rpc RefreshOAuthV2(OAuthExchangeRequest) returns (OAuthToken);
  rpc ExchangeOAuthV2Token(OAuthExchangeRequest) returns (OAuthToken);
  rpc BeginShortTokenRotation(ShortTokenRotationRequest) returns (ShortTokenRotationResponse);
  rpc CompleteShortTokenRotation(ShortTokenRotationRequest) returns (ShortTokenRotationResponse);
  rpc OpenIDConnectToken(OpenIDConnectTokenRequest) returns (OpenIDConnectTokenResponse);
  rpc OpenIDConnectUserInfo(OpenIDConnectUserInfoRequest) returns (OpenIDConnectUserInfoResponse);
  rpc OpenIDKeys(OpenIDKeysRequest) returns (OpenIDKeysResponse);
}
