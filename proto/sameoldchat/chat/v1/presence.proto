syntax = "proto3";

package sameoldchat.chat.v1;

option go_package = "github.com/sameoldchat/sameoldchat/internal/modules/chat/transport/grpc/gen/sameoldchat/chat/v1;chatv1";

import "sameoldchat/chat/v1/conversation_mutations.proto";

message UserProfile {
  string display_name = 1;
  string status_text = 2;
  string status_emoji = 3;
  string image_24 = 4;
  string image_32 = 5;
  string image_48 = 6;
  string image_72 = 7;
  string image_192 = 8;
  string image_512 = 9;
  string image_1024 = 10;
  int64 status_expiration = 11;
  // Internal lifecycle fence; never projected by the Slack Web API.
  string active_scheduled_status_id = 12;
}

message User {
  string id = 1;
  string workspace_id = 2;
  string email = 3;
  string name = 4;
  string real_name = 5;
  UserProfile profile = 6;
  string presence = 7;
  bool deleted = 8;
  int64 last_active_at_unix_nano = 9;
}

message SetUserPresenceRequest {
  string workspace_id = 1;
  string user_id = 2;
  string presence = 3;
}

message UserRequest {
  string workspace_id = 1;
  string user_id = 2;
  string requested_user_id = 3;
}

message UserByEmailRequest {
  string workspace_id = 1;
  string user_id = 2;
  string email = 3;
}

message SetUserProfileRequest {
  string workspace_id = 1;
  string user_id = 2;
  UserProfile profile = 3;
}

message ScheduledStatus {
  string id = 1;
  string workspace_id = 2;
  string user_id = 3;
  string status_text = 4;
  string status_emoji = 5;
  int64 starts_at = 6;
  int64 ends_at = 7;
  int64 created_at_unix_nano = 8;
  int64 updated_at_unix_nano = 9;
}

message ScheduleUserStatusRequest {
  string workspace_id = 1;
  string user_id = 2;
  string status_text = 3;
  string status_emoji = 4;
  int64 starts_at = 5;
  int64 ends_at = 6;
}

message ScheduledUserStatusesRequest {
  string workspace_id = 1;
  string user_id = 2;
}

message ScheduledUserStatusesResponse {
  repeated ScheduledStatus statuses = 1;
}

message UpdateScheduledUserStatusRequest {
  string workspace_id = 1;
  string user_id = 2;
  string id = 3;
  string status_text = 4;
  string status_emoji = 5;
  int64 starts_at = 6;
  int64 ends_at = 7;
}

message DeleteScheduledUserStatusRequest {
  string workspace_id = 1;
  string user_id = 2;
  string id = 3;
}

message DoNotDisturb {
  string workspace_id = 1;
  string user_id = 2;
  bool enabled = 3;
  int64 snooze_until = 4;
  int64 next_start_at = 5;
  int64 next_end_at = 6;
}

message DoNotDisturbRequest {
  string workspace_id = 1;
  string user_id = 2;
  string requested_user_id = 3;
}

message SetSnoozeRequest {
  string workspace_id = 1;
  string user_id = 2;
  int64 minutes = 3;
}

message ProfileFieldDefinition {
  string workspace_id = 1;
  string field_id = 2;
  int64 ordering = 3;
  string label = 4;
  string hint = 5;
  string type = 6;
  repeated string possible_values = 7;
  bool is_hidden = 8;
  int64 created_at_unix_nano = 9;
}

message SetWorkspaceProfileFieldRequest {
  string workspace_id = 1;
  string user_id = 2;
  ProfileFieldDefinition field = 3;
}

message WorkspaceProfileFieldsRequest {
  string workspace_id = 1;
  string user_id = 2;
}

message WorkspaceProfileFieldsResponse {
  repeated ProfileFieldDefinition fields = 1;
}

message DeleteWorkspaceProfileFieldRequest {
  string workspace_id = 1;
  string user_id = 2;
  string field_id = 3;
}

message UserProfileFieldValue {
  string field_id = 1;
  string value = 2;
  string alt = 3;
}

message SetUserProfileFieldsRequest {
  string workspace_id = 1;
  string user_id = 2;
  string target_user_id = 3;
  repeated UserProfileFieldValue values = 4;
}

message UserProfileFieldsRequest {
  string workspace_id = 1;
  string user_id = 2;
  string target_user_id = 3;
}

message UserProfileFieldsResponse {
  repeated UserProfileFieldValue values = 1;
}

service PresenceService {
  rpc UserInfo(UserRequest) returns (User);
  rpc SetWorkspaceProfileField(SetWorkspaceProfileFieldRequest) returns (ProfileFieldDefinition);
  rpc WorkspaceProfileFields(WorkspaceProfileFieldsRequest) returns (WorkspaceProfileFieldsResponse);
  rpc DeleteWorkspaceProfileField(DeleteWorkspaceProfileFieldRequest) returns (MutationResponse);
  rpc SetUserProfileFields(SetUserProfileFieldsRequest) returns (MutationResponse);
  rpc UserProfileFields(UserProfileFieldsRequest) returns (UserProfileFieldsResponse);
  rpc UserByEmail(UserByEmailRequest) returns (User);
  rpc SetUserProfile(SetUserProfileRequest) returns (User);
  rpc ScheduleUserStatus(ScheduleUserStatusRequest) returns (ScheduledStatus);
  rpc ScheduledUserStatuses(ScheduledUserStatusesRequest) returns (ScheduledUserStatusesResponse);
  rpc UpdateScheduledUserStatus(UpdateScheduledUserStatusRequest) returns (ScheduledStatus);
  rpc DeleteScheduledUserStatus(DeleteScheduledUserStatusRequest) returns (MutationResponse);
  rpc SetUserPresence(SetUserPresenceRequest) returns (User);
  rpc DoNotDisturbInfo(DoNotDisturbRequest) returns (DoNotDisturb);
  rpc SetSnooze(SetSnoozeRequest) returns (DoNotDisturb);
  rpc EndSnooze(DoNotDisturbRequest) returns (DoNotDisturb);
  rpc EndDND(DoNotDisturbRequest) returns (MutationResponse);
}
