syntax = "proto3";

package sameoldchat.chat.v1;

option go_package = "github.com/sameoldchat/sameoldchat/internal/modules/chat/transport/grpc/gen/sameoldchat/chat/v1;chatv1";

import "sameoldchat/chat/v1/conversation_mutations.proto";

message Canvas {
  string id = 1;
  string workspace_id = 2;
  string owner_id = 3;
  string title = 4;
  string document_content = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  int64 version = 8;
}

message CreateCanvasRequest {
  string workspace_id = 1;
  string user_id = 2;
  string title = 3;
  string document_content = 4;
  string channel_id = 5;
}

message CanvasRequest {
  string workspace_id = 1;
  string user_id = 2;
  string canvas_id = 3;
}

message CanvasesRequest {
  string workspace_id = 1;
  string user_id = 2;
  int32 limit = 3;
  string cursor = 4;
  bool descending = 5;
}

message CanvasComment {
  string id = 1;
  string canvas_id = 2;
  string workspace_id = 3;
  string section_id = 4;
  string user_id = 5;
  string text = 6;
  int64 created_at_unix_nano = 7;
  bool deleted = 8;
}

message CanvasCommentPage {
  repeated CanvasComment comments = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message CommentOnCanvasRequest {
  string workspace_id = 1;
  string user_id = 2;
  string canvas_id = 3;
  string section_id = 4;
  string text = 5;
}

message CanvasCommentsRequest {
  string workspace_id = 1;
  string user_id = 2;
  string canvas_id = 3;
  int32 limit = 4;
  string cursor = 5;
}

message DeleteCanvasCommentRequest {
  string workspace_id = 1;
  string user_id = 2;
  string comment_id = 3;
}

message CanvasRevision {
  string canvas_id = 1;
  string workspace_id = 2;
  int64 version = 3;
  string title = 4;
  string document_content = 5;
  string edited_by = 6;
  int64 created_at_unix_nano = 7;
}

message CanvasRevisionPage {
  repeated CanvasRevision revisions = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message CanvasGrant {
  string canvas_id = 1;
  string entity_type = 2;
  string entity_id = 3;
  string access = 4;
}

message CanvasGrantsResponse {
  repeated CanvasGrant grants = 1;
}

message CanvasGrantsRequest {
  string workspace_id = 1;
  string user_id = 2;
  string canvas_id = 3;
}

message CanvasRevisionsRequest {
  string workspace_id = 1;
  string user_id = 2;
  string canvas_id = 3;
  int32 limit = 4;
  string cursor = 5;
}

message RestoreCanvasRevisionRequest {
  string workspace_id = 1;
  string user_id = 2;
  string canvas_id = 3;
  int64 version = 4;
}

message SearchCanvasesRequest {
  string workspace_id = 1;
  string user_id = 2;
  string query = 3;
  int32 limit = 4;
  string cursor = 5;
  string sort = 6;
  string direction = 7;
}

message CanvasPage {
  repeated Canvas canvases = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message EditCanvasRequest {
  string workspace_id = 1;
  string user_id = 2;
  string canvas_id = 3;
  string changes = 4;
}

message CanvasAccessRequest {
  string workspace_id = 1;
  string user_id = 2;
  string canvas_id = 3;
  string access_level = 4;
  repeated string channel_ids = 5;
  repeated string user_ids = 6;
}

message CanvasAccessDeleteRequest {
  string workspace_id = 1;
  string user_id = 2;
  string canvas_id = 3;
  repeated string channel_ids = 4;
  repeated string user_ids = 5;
}

message CanvasAccessResponse {
  string canvas_id = 1;
  string entity_type = 2;
  string entity_id = 3;
  string access = 4;
}

message CanvasSection {
  string id = 1;
  string type = 2;
  string text = 3;
}

message CanvasSectionsLookupRequest {
  string workspace_id = 1;
  string user_id = 2;
  string canvas_id = 3;
  string criteria = 4;
}

message CanvasSectionsResponse {
  repeated CanvasSection sections = 1;
}

service CanvasesService {
  rpc CreateCanvas(CreateCanvasRequest) returns (Canvas);
  rpc CreateConversationCanvas(CreateCanvasRequest) returns (Canvas);
  rpc ConversationCanvas(CreateCanvasRequest) returns (Canvas);
  rpc GetCanvas(CanvasRequest) returns (Canvas);
  rpc GetCanvasAccess(CanvasRequest) returns (CanvasAccessResponse);
  rpc ListCanvases(CanvasesRequest) returns (CanvasPage);
  rpc SearchCanvases(SearchCanvasesRequest) returns (CanvasPage);
  rpc CanvasRevisions(CanvasRevisionsRequest) returns (CanvasRevisionPage);
  rpc CanvasGrants(CanvasGrantsRequest) returns (CanvasGrantsResponse);
  rpc CommentOnCanvas(CommentOnCanvasRequest) returns (CanvasComment);
  rpc CanvasComments(CanvasCommentsRequest) returns (CanvasCommentPage);
  rpc DeleteCanvasComment(DeleteCanvasCommentRequest) returns (MutationResponse);
  rpc RestoreCanvasRevision(RestoreCanvasRevisionRequest) returns (Canvas);
  rpc EditCanvas(EditCanvasRequest) returns (MutationResponse);
  rpc DeleteCanvas(CanvasRequest) returns (MutationResponse);
  rpc SetCanvasAccess(CanvasAccessRequest) returns (MutationResponse);
  rpc DeleteCanvasAccess(CanvasAccessDeleteRequest) returns (MutationResponse);
  rpc LookupCanvasSections(CanvasSectionsLookupRequest) returns (CanvasSectionsResponse);
}
