syntax = "proto3";

package sameoldchat.chat.v1;

option go_package = "github.com/sameoldchat/sameoldchat/internal/modules/chat/transport/grpc/gen/sameoldchat/chat/v1;chatv1";

message AccessLog {
  string workspace_id = 1;
  string user_id = 2;
  string username = 3;
  int64 created_at = 4;
  string ip = 5;
  string user_agent = 6;
}

message RecordAccessRequest {
  string workspace_id = 1;
  string user_id = 2;
  string ip = 3;
  string user_agent = 4;
}

message AccessLogsRequest {
  string workspace_id = 1;
  string user_id = 2;
  int64 before = 3;
  int32 limit = 4;
  int32 page = 5;
}

message AccessLogsResponse {
  repeated AccessLog logs = 1;
  bool has_more = 2;
}

message AccessMutationResponse {
  bool ok = 1;
}

message WorkspaceAnalyticsRequest {
  string workspace_id = 1;
  string user_id = 2;
  int64 since = 3;
}

message ChannelActivity {
  string conversation_id = 1;
  string name = 2;
  int32 messages = 3;
}

message WorkspaceAnalytics {
  int32 members = 1;
  int32 active_members = 2;
  int32 guests = 3;
  int32 admins = 4;
  int32 public_channels = 5;
  int32 private_channels = 6;
  int32 archived_channels = 7;
  int32 messages = 8;
  int32 recent_messages = 9;
  int32 files = 10;
  int32 recent_files = 11;
  repeated ChannelActivity busiest_channels = 12;
  int64 since = 13;
}

message IntegrationLog {
  string app_id = 1;
  string app_type = 2;
  string change_type = 3;
  string channel_id = 4;
  int64 date_unix = 5;
  string scope = 6;
  string service_id = 7;
  string service_type = 8;
  string user_id = 9;
  string user_name = 10;
}

message IntegrationLogsRequest {
  string workspace_id = 1;
  string user_id = 2;
  string app_id = 3;
  string change_type = 4;
  string service_id = 5;
  string user_filter = 6;
  int32 count = 7;
  int32 page = 8;
}

message IntegrationLogsResponse {
  repeated IntegrationLog logs = 1;
  int32 page = 2;
  int32 pages = 3;
  int32 total = 4;
}

service AccessLogsService {
  rpc RecordAccess(RecordAccessRequest) returns (AccessMutationResponse);
  rpc AccessLogs(AccessLogsRequest) returns (AccessLogsResponse);
  // Named GetWorkspaceAnalytics because an rpc named WorkspaceAnalytics would
  // shadow the WorkspaceAnalytics message type for every later return in this
  // service, exactly as GetReadCursor does in InteractionsService.
  rpc GetWorkspaceAnalytics(WorkspaceAnalyticsRequest) returns (WorkspaceAnalytics);
  rpc IntegrationLogs(IntegrationLogsRequest) returns (IntegrationLogsResponse);
}
