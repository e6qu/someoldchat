syntax = "proto3";

package sameoldchat.chat.v1;

option go_package = "github.com/sameoldchat/sameoldchat/internal/modules/chat/transport/grpc/gen/sameoldchat/chat/v1;chatv1";

import "sameoldchat/chat/v1/conversation_mutations.proto";

message Reminder {
  string workspace_id = 1;
  string id = 2;
  string creator_id = 3;
  string user_id = 4;
  string text = 5;
  int64 time = 6;
  int64 complete_ts = 7;
  bool recurring = 8;
}

message AddReminderRequest {
  string workspace_id = 1;
  string user_id = 2;
  string target_user_id = 3;
  string text = 4;
  int64 time = 5;
}

message ReminderRequest {
  string workspace_id = 1;
  string user_id = 2;
  string reminder_id = 3;
}

message RemindersRequest {
  string workspace_id = 1;
  string user_id = 2;
  int32 limit = 3;
  string cursor = 4;
}

message ReminderPage {
  repeated Reminder reminders = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message LaterReminder {
  string id = 1;
  string workspace_id = 2;
  string creator_id = 3;
  string user_id = 4;
  string channel_id = 5;
  string source_message_id = 6;
  string source_conversation_id = 7;
  string target = 8;
  string text = 9;
  int64 due_at = 10;
  string timezone = 11;
  string recurrence = 12;
  int64 created_at = 13;
  int64 updated_at = 14;
  int64 completed_at = 15;
  int64 last_delivered_at = 16;
  int64 failed_at = 17;
  string failure_code = 18;
  string source_timestamp = 19;
}

message CreateLaterReminderRequest {
  string workspace_id = 1;
  string user_id = 2;
  string target = 3;
  string channel_id = 4;
  string source_channel_id = 5;
  string source_timestamp = 6;
  string text = 7;
  int64 due_at = 8;
  string timezone = 9;
  string recurrence = 10;
}

message LaterReminderRequest {
  string workspace_id = 1;
  string user_id = 2;
  string reminder_id = 3;
}

message LaterRemindersRequest {
  string workspace_id = 1;
  string user_id = 2;
  string target = 3;
  int32 limit = 4;
  string cursor = 5;
  bool descending = 6;
}

message UpdateLaterReminderRequest {
  string workspace_id = 1;
  string user_id = 2;
  string reminder_id = 3;
  string target = 4;
  string channel_id = 5;
  string text = 6;
  int64 due_at = 7;
  string timezone = 8;
  string recurrence = 9;
}

message LaterReminderPage {
  repeated LaterReminder reminders = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

service RemindersService {
  rpc AddReminder(AddReminderRequest) returns (Reminder);
  rpc ReminderInfo(ReminderRequest) returns (Reminder);
  rpc Reminders(RemindersRequest) returns (ReminderPage);
  rpc CompleteReminder(ReminderRequest) returns (MutationResponse);
  rpc DeleteReminder(ReminderRequest) returns (MutationResponse);
  rpc CreateLaterReminder(CreateLaterReminderRequest) returns (LaterReminder);
  rpc LaterReminderInfo(LaterReminderRequest) returns (LaterReminder);
  rpc LaterReminders(LaterRemindersRequest) returns (LaterReminderPage);
  rpc UpdateLaterReminder(UpdateLaterReminderRequest) returns (LaterReminder);
  rpc CompleteLaterReminder(LaterReminderRequest) returns (MutationResponse);
  rpc DeleteLaterReminder(LaterReminderRequest) returns (MutationResponse);
}
