syntax = "proto3";

package sameoldchat.chat.v1;

option go_package = "github.com/sameoldchat/sameoldchat/internal/modules/chat/transport/grpc/gen/sameoldchat/chat/v1;chatv1";

import "sameoldchat/chat/v1/conversation_mutations.proto";

message Reminder {
  string workspace_id = 1;
  string id = 2;
  string creator_id = 3;
  string user_id = 4;
  string text = 5;
  int64 time = 6;
  int64 complete_ts = 7;
  bool recurring = 8;
  string recurrence = 9;
  string time_zone = 10;
  int64 recurrence_anchor = 11;
  // The days a weekly reminder recurs on, as lower-case day names.
  repeated string weekdays = 12;
}

message AddReminderRequest {
  string workspace_id = 1;
  string user_id = 2;
  string target_user_id = 3;
  string text = 4;
  int64 time = 5;
  string recurrence = 6;
  string time_zone = 7;
  repeated string weekdays = 8;
  // recurrence_anchor positions a recurring series when it differs from
  // time; zero means the series starts at time.
  int64 recurrence_anchor = 9;
}

message ReminderRequest {
  string workspace_id = 1;
  string user_id = 2;
  string reminder_id = 3;
}

message RemindersRequest {
  string workspace_id = 1;
  string user_id = 2;
  int32 limit = 3;
  string cursor = 4;
}

message ReminderPage {
  repeated Reminder reminders = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

// ChannelReminder is a reminder /remind set for a channel; Slackbot posts it
// there when it comes due. It is not a to-do.
message ChannelReminder {
  string id = 1;
  string workspace_id = 2;
  string creator_id = 3;
  string channel_id = 4;
  string text = 5;
  int64 due_at_unix_nano = 6;
  string timezone = 7;
  string recurrence = 8;
  int64 recurrence_anchor_unix_nano = 9;
  int64 created_at_unix_nano = 10;
  int64 updated_at_unix_nano = 11;
  int64 last_delivered_at_unix_nano = 12;
  int64 failed_at_unix_nano = 13;
  string failure_code = 14;
}

message CreateChannelReminderRequest {
  string workspace_id = 1;
  string user_id = 2;
  string channel_id = 3;
  string text = 4;
  int64 due_at_unix_nano = 5;
  string timezone = 6;
  string recurrence = 7;
  // recurrence_anchor_unix_nano positions a recurring series when it differs
  // from due_at_unix_nano; zero means the series starts there.
  int64 recurrence_anchor_unix_nano = 8;
}

message ChannelRemindersRequest {
  string workspace_id = 1;
  string user_id = 2;
  int32 limit = 3;
  string cursor = 4;
  bool descending = 5;
}

message ChannelReminderPage {
  repeated ChannelReminder reminders = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message DeleteChannelReminderRequest {
  string workspace_id = 1;
  string user_id = 2;
  string reminder_id = 3;
}

service RemindersService {
  rpc AddReminder(AddReminderRequest) returns (Reminder);
  rpc ReminderInfo(ReminderRequest) returns (Reminder);
  rpc Reminders(RemindersRequest) returns (ReminderPage);
  rpc CompleteReminder(ReminderRequest) returns (MutationResponse);
  rpc DeleteReminder(ReminderRequest) returns (MutationResponse);
  rpc CreateChannelReminder(CreateChannelReminderRequest) returns (ChannelReminder);
  rpc ChannelReminders(ChannelRemindersRequest) returns (ChannelReminderPage);
  rpc DeleteChannelReminder(DeleteChannelReminderRequest) returns (MutationResponse);
}
