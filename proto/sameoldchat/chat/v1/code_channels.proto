syntax = "proto3";

package sameoldchat.chat.v1;

option go_package = "github.com/sameoldchat/sameoldchat/internal/modules/chat/transport/grpc/gen/sameoldchat/chat/v1;chatv1";

import "sameoldchat/chat/v1/canvases.proto";

// CodeChannelContextItem is one item of a code channel's context bar.
message CodeChannelContextItem {
  string key = 1;
  string label = 2;
  string icon = 3;
  string url = 4;
  string item_type = 5;
  string bot_user_id = 6;
}

// AgentResource is the external resource an agent's work lives in.
message AgentResource {
  string url = 1;
  string resource_type = 2;
  string title = 3;
  string provider = 4;
}

// CodeChannelCommand is one agent command of a code channel.
message CodeChannelCommand {
  string name = 1;
  string description = 2;
  string argument_hint = 3;
  bool should_escape = 4;
  string app_id = 5;
  string bot_user_id = 6;
}

// CodeChannel is a code channel's record beside its conversation.
message CodeChannel {
  string workspace_id = 1;
  string conversation = 2;
  string app_id = 3;
  string bot_user_id = 4;
  string session_id = 5;
  string origin_channel = 6;
  string origin_ts = 7;
  repeated CodeChannelContextItem context_bar = 8;
  string summary_message_ts = 9;
  string summary_thread_ts = 10;
  AgentResource agent_resource = 11;
  int64 created_at_unix_nano = 12;
  int64 updated_at_unix_nano = 13;
  repeated CodeChannelCommand commands = 14;
}

message CreateCodeChannelRequest {
  string workspace_id = 1;
  string user_id = 2;
  string app_id = 3;
  string session_id = 4;
  string name = 5;
  bool is_private = 6;
  string origin_channel = 7;
  string origin_ts = 8;
}

message ArchiveCodeChannelRequest {
  string workspace_id = 1;
  string user_id = 2;
  string app_id = 3;
  string conversation = 4;
  string summary_message_ts = 5;
}

// SetCodeChannelPropertiesRequest carries domain.CodeChannelProperties: each
// presence flag or optional field names a property the call writes.
message SetCodeChannelPropertiesRequest {
  string workspace_id = 1;
  string user_id = 2;
  string app_id = 3;
  string conversation = 4;
  bool set_context_bar = 5;
  repeated CodeChannelContextItem context_bar = 6;
  bool set_summary = 7;
  string summary_message_ts = 8;
  string summary_thread_ts = 9;
  optional string resource_url = 10;
  optional string resource_type = 11;
  optional string resource_title = 12;
  optional string resource_provider = 13;
}

message CodeChannelRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation = 3;
}

message CodeChannelMutationResponse {
  bool ok = 1;
}

// CodeChannelView is one view tab of a code channel.
message CodeChannelView {
  string workspace_id = 1;
  string conversation = 2;
  string id = 3;
  string file_id = 4;
  string key = 5;
  string type = 6;
  string label = 7;
  string app_id = 8;
  string bot_user_id = 9;
  string content = 10;
  string blocks = 11;
  string canvas_id = 12;
  string access_level = 13;
  string agent_content_hash = 14;
  string pr_url = 15;
  string base_branch = 16;
  string head_branch = 17;
  repeated string csp_connect_domains = 18;
  repeated string csp_resource_domains = 19;
  int64 version = 20;
  int64 created_at_unix_nano = 21;
  int64 updated_at_unix_nano = 22;
}

message SetCodeChannelViewRequest {
  string workspace_id = 1;
  string user_id = 2;
  string app_id = 3;
  string conversation = 4;
  string type = 5;
  string key = 6;
  string name = 7;
  string content = 8;
  string blocks = 9;
  string canvas_id = 10;
  string access_level = 11;
  string agent_content_hash = 12;
  string pr_url = 13;
  string base_branch = 14;
  string head_branch = 15;
  repeated string csp_connect_domains = 16;
  repeated string csp_resource_domains = 17;
}

message CodeChannelViewsResponse {
  repeated CodeChannelView views = 1;
}

message RemoveCodeChannelViewRequest {
  string workspace_id = 1;
  string user_id = 2;
  string app_id = 3;
  string conversation = 4;
  string view_id = 5;
  string view_key = 6;
}

message RemoveCodeChannelViewResponse {
  string view_id = 1;
}

message SetCodeChannelCommandsRequest {
  string workspace_id = 1;
  string user_id = 2;
  string app_id = 3;
  string conversation = 4;
  repeated CodeChannelCommand commands = 5;
}

message SetCodeChannelCommandsResponse {
  int32 command_count = 1;
}

message CodeChannelCanvasRequest {
  string workspace_id = 1;
  string user_id = 2;
  string app_id = 3;
  string conversation = 4;
  string canvas_id = 5;
}

message CodeChannelCanvasResponse {
  Canvas canvas = 1;
  CanvasCommentPage comments = 2;
}

message SetCodeChannelCanvasContentRequest {
  string workspace_id = 1;
  string user_id = 2;
  string app_id = 3;
  string conversation = 4;
  string canvas_id = 5;
  string content = 6;
}

message SetCodeChannelCanvasContentResponse {
  int32 sections_changed_count = 1;
}

service CodeChannelsService {
  rpc CreateCodeChannel(CreateCodeChannelRequest) returns (CodeChannel);
  rpc ArchiveCodeChannel(ArchiveCodeChannelRequest) returns (CodeChannelMutationResponse);
  rpc SetCodeChannelProperties(SetCodeChannelPropertiesRequest) returns (CodeChannelMutationResponse);
  rpc GetCodeChannel(CodeChannelRequest) returns (CodeChannel);
  rpc SetCodeChannelView(SetCodeChannelViewRequest) returns (CodeChannelView);
  rpc ListCodeChannelViews(CodeChannelRequest) returns (CodeChannelViewsResponse);
  rpc RemoveCodeChannelView(RemoveCodeChannelViewRequest) returns (RemoveCodeChannelViewResponse);
  rpc SetCodeChannelCommands(SetCodeChannelCommandsRequest) returns (SetCodeChannelCommandsResponse);
  rpc GetCodeChannelCanvas(CodeChannelCanvasRequest) returns (CodeChannelCanvasResponse);
  rpc SetCodeChannelCanvasContent(SetCodeChannelCanvasContentRequest) returns (SetCodeChannelCanvasContentResponse);
}
