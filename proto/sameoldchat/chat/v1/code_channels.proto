syntax = "proto3";

package sameoldchat.chat.v1;

option go_package = "github.com/sameoldchat/sameoldchat/internal/modules/chat/transport/grpc/gen/sameoldchat/chat/v1;chatv1";

// CodeChannelContextItem is one item of a code channel's context bar.
message CodeChannelContextItem {
  string key = 1;
  string label = 2;
  string icon = 3;
  string url = 4;
  string item_type = 5;
  string bot_user_id = 6;
}

// AgentResource is the external resource an agent's work lives in.
message AgentResource {
  string url = 1;
  string resource_type = 2;
  string title = 3;
  string provider = 4;
}

// CodeChannel is a code channel's record beside its conversation.
message CodeChannel {
  string workspace_id = 1;
  string conversation = 2;
  string app_id = 3;
  string bot_user_id = 4;
  string session_id = 5;
  string origin_channel = 6;
  string origin_ts = 7;
  repeated CodeChannelContextItem context_bar = 8;
  string summary_message_ts = 9;
  string summary_thread_ts = 10;
  AgentResource agent_resource = 11;
  int64 created_at_unix_nano = 12;
  int64 updated_at_unix_nano = 13;
}

message CreateCodeChannelRequest {
  string workspace_id = 1;
  string user_id = 2;
  string app_id = 3;
  string session_id = 4;
  string name = 5;
  bool is_private = 6;
  string origin_channel = 7;
  string origin_ts = 8;
}

message ArchiveCodeChannelRequest {
  string workspace_id = 1;
  string user_id = 2;
  string app_id = 3;
  string conversation = 4;
  string summary_message_ts = 5;
}

// SetCodeChannelPropertiesRequest carries domain.CodeChannelProperties: each
// presence flag or optional field names a property the call writes.
message SetCodeChannelPropertiesRequest {
  string workspace_id = 1;
  string user_id = 2;
  string app_id = 3;
  string conversation = 4;
  bool set_context_bar = 5;
  repeated CodeChannelContextItem context_bar = 6;
  bool set_summary = 7;
  string summary_message_ts = 8;
  string summary_thread_ts = 9;
  optional string resource_url = 10;
  optional string resource_type = 11;
  optional string resource_title = 12;
  optional string resource_provider = 13;
}

message CodeChannelRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation = 3;
}

message CodeChannelMutationResponse {
  bool ok = 1;
}

service CodeChannelsService {
  rpc CreateCodeChannel(CreateCodeChannelRequest) returns (CodeChannel);
  rpc ArchiveCodeChannel(ArchiveCodeChannelRequest) returns (CodeChannelMutationResponse);
  rpc SetCodeChannelProperties(SetCodeChannelPropertiesRequest) returns (CodeChannelMutationResponse);
  rpc GetCodeChannel(CodeChannelRequest) returns (CodeChannel);
}
