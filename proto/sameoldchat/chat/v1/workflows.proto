syntax = "proto3";

package sameoldchat.chat.v1;

option go_package = "github.com/sameoldchat/sameoldchat/internal/modules/chat/transport/grpc/gen/sameoldchat/chat/v1;chatv1";

message WorkflowStepRequest {
  string workspace_id = 1;
  string user_id = 2;
  string workflow_step_execute_id = 3;
  string outputs = 4;
  string error = 5;
}

message WorkflowStepUpdateRequest {
  string workspace_id = 1;
  string user_id = 2;
  string workflow_step_edit_id = 3;
  string inputs = 4;
  string outputs = 5;
  string step_name = 6;
  string step_image_url = 7;
}

message WorkflowStepMutationResponse {
  bool ok = 1;
}

message WorkflowDefinition {
  string id = 1;
  string workspace_id = 2;
  string app_id = 3;
  string owner_id = 4;
  string callback_id = 5;
  string title = 6;
  string description = 7;
  string icon = 15;
  repeated string manager_ids = 16;
  string input_schema = 8;
  string steps = 9;
  string status = 10;
  uint64 version = 11;
  uint64 published_version = 12;
  int64 created_at_unix_nano = 13;
  int64 updated_at_unix_nano = 14;
}

message WorkflowMutationRequest {
  string workspace_id = 1;
  string user_id = 2;
  WorkflowDefinition workflow = 3;
  uint64 expected_version = 4;
  bool publish = 5;
}

message WorkflowGetRequest {
  string workspace_id = 1;
  string user_id = 2;
  string workflow_id = 3;
}

message WorkflowDiscardStagedRequest {
  string workspace_id = 1;
  string user_id = 2;
  string workflow_id = 3;
  uint64 expected_version = 4;
}

message WorkflowDeleteRequest {
  string workspace_id = 1;
  string user_id = 2;
  string workflow_id = 3;
  uint64 expected_version = 4;
}

message WorkflowManagersRequest {
  string workspace_id = 1;
  string user_id = 2;
  string workflow_id = 3;
  repeated string manager_ids = 4;
}

message WorkflowManagePermissionResponse {
  bool can_manage = 1;
}

message WorkflowActivitySummary {
  int32 queued = 1;
  int32 running = 2;
  int32 completed = 3;
  int32 failed = 4;
  int32 cancelled = 5;
  repeated WorkflowRun recent_runs = 6;
}

message WorkflowFormSubmitRequest {
  string workspace_id = 1;
  string user_id = 2;
  string run_id = 3;
  string step_id = 4;
  string inputs = 5;
}

message WorkflowButtonRequest {
  string workspace_id = 1;
  string user_id = 2;
  string run_id = 3;
  string step_id = 4;
}

message WorkflowInteractionField {
  string name = 1;
  string label = 2;
}

message WorkflowInteraction {
  string step_id = 1;
  string kind = 2;
  string title = 3;
  string label = 4;
  repeated WorkflowInteractionField fields = 5;
}

message WorkflowRunListResponse {
  repeated WorkflowRun runs = 1;
}

message WorkflowFormResponse {
  string run_id = 1;
  uint64 workflow_version = 2;
  string form_title = 3;
  string field = 4;
  string value = 5;
  int64 submitted_at_unix_nano = 6;
}

message WorkflowFormResponseListResponse {
  repeated WorkflowFormResponse responses = 1;
}

message WorkflowStepChange {
  int32 position = 1;
  string function_id = 2;
  string change = 3;
}

message WorkflowStepChangesRequest {
  string workspace_id = 1;
  string user_id = 2;
  string workflow_id = 3;
}

message WorkflowStepChangesResponse {
  repeated WorkflowStepChange changes = 1;
}

message WorkflowListRequest {
  string workspace_id = 1;
  string user_id = 2;
  int32 limit = 3;
  string cursor = 4;
  bool descending = 5;
}

message AdminWorkflowListRequest {
  string workspace_id = 1;
  string user_id = 2;
  int32 limit = 3;
  string cursor = 4;
  bool descending = 5;
  string query = 6;
}

message WorkflowCollaboratorsRequest {
  string workspace_id = 1;
  string user_id = 2;
  repeated string workflow_ids = 3;
  repeated string collaborator_ids = 4;
  bool adding = 5;
}

message AdminUnpublishWorkflowsRequest {
  string workspace_id = 1;
  string user_id = 2;
  repeated string workflow_ids = 3;
}

message AdminUnpublishWorkflowsResponse {
  bool ok = 1;
}

message WorkflowListResponse {
  repeated WorkflowDefinition workflows = 1;
  bool has_more = 2;
  string next_cursor = 3;
}

message WorkflowTrigger {
  string id = 1;
  string workflow_id = 2;
  string workspace_id = 3;
  string app_id = 4;
  string title = 5;
  string type = 6;
  string config = 7;
  bool enabled = 8;
  uint64 version = 9;
  int64 created_at_unix_nano = 10;
  int64 updated_at_unix_nano = 11;
  int64 next_run_at_unix_nano = 12;
}

message WorkflowTriggerMutationRequest {
  string workspace_id = 1;
  string user_id = 2;
  WorkflowTrigger trigger = 3;
  uint64 expected_version = 4;
}

message WorkflowTriggerListRequest {
  string workspace_id = 1;
  string user_id = 2;
  string workflow_id = 3;
}

message WorkflowTriggerListResponse {
  repeated WorkflowTrigger triggers = 1;
}

message WorkflowRun {
  string id = 1;
  string workflow_id = 2;
  uint64 workflow_version = 3;
  string trigger_id = 4;
  string workspace_id = 5;
  string app_id = 6;
  string actor_id = 7;
  string channel_id = 8;
  string status = 9;
  string inputs = 10;
  string outputs = 11;
  string error = 12;
  int32 current_step = 13;
  string idempotency_key = 14;
  int64 created_at_unix_nano = 15;
  int64 updated_at_unix_nano = 16;
  int64 completed_at_unix_nano = 17;
}

message WorkflowRunRequest {
  string workspace_id = 1;
  string user_id = 2;
  string trigger_id = 3;
  string channel_id = 4;
  string inputs = 5;
  string idempotency_key = 6;
}

message AutomaticWorkflowRunRequest {
  string workspace_id = 1;
  string trigger_id = 2;
  string channel_id = 3;
  string inputs = 4;
  string idempotency_key = 5;
}

message WebhookWorkflowRunRequest {
  string workspace_id = 1;
  string trigger_id = 2;
  string secret = 3;
  string inputs = 4;
}

message WebhookTriggerURLRequest {
  string workspace_id = 1;
  string user_id = 2;
  string trigger_id = 3;
}

message WebhookTriggerURLResponse {
  string url = 1;
}

message WorkflowEventDispatchRequest {
  string workspace_id = 1;
  int32 limit = 2;
}

message WorkflowEventDispatchResponse {
  int32 started = 1;
}

message WorkflowRunGetRequest {
  string workspace_id = 1;
  string user_id = 2;
  string workflow_run_id = 3;
}

message FunctionCompletionRequest {
  string workspace_id = 1;
  string user_id = 2;
  string app_id = 3;
  string function_execution_id = 4;
  string outputs = 5;
  string error = 6;
}

message AutomationPermission {
  string resource_type = 1;
  string resource_id = 2;
  string workspace_id = 3;
  string app_id = 4;
  string permission_type = 5;
  repeated string user_ids = 6;
  repeated string channel_ids = 7;
  repeated string team_ids = 8;
  repeated string org_ids = 9;
  int64 updated_at_unix_nano = 10;
}

message FunctionPermissionRequest {
  string workspace_id = 1;
  string user_id = 2;
  string app_id = 3;
  string function_id = 4;
  string function_callback_id = 5;
  AutomationPermission permission = 6;
}

message TriggerPermissionRequest {
  string workspace_id = 1;
  string user_id = 2;
  string app_id = 3;
  string trigger_id = 4;
  AutomationPermission permission = 5;
}

message WorkflowPermissionRequest {
  string workspace_id = 1;
  string user_id = 2;
  string workflow_id = 3;
  string scope = 4;
  AutomationPermission permission = 5;
}

message FeaturedWorkflowsRequest {
  string workspace_id = 1;
  string user_id = 2;
  string channel_id = 3;
  repeated string channel_ids = 4;
  repeated string trigger_ids = 5;
}

message FeaturedWorkflow {
  string workspace_id = 1;
  string channel_id = 2;
  string trigger_id = 3;
  string title = 4;
  int32 position = 5;
}

message FeaturedWorkflowsResponse {
  repeated FeaturedWorkflow workflows = 1;
}

message FunctionWorkflowStepsRequest {
  string workspace_id = 1;
  string user_id = 2;
  string app_id = 3;
  string function_id = 4;
  string workflow_id = 5;
  string workflow = 6;
  string workflow_app_id = 7;
}

message WorkflowStepVersion {
  string title = 1;
  string workflow_id = 2;
  string step_id = 3;
  bool is_deleted = 4;
  string workflow_version_created = 5;
}

message WorkflowStepVersionsResponse {
  repeated WorkflowStepVersion steps_versions = 1;
}

message WorkflowStepResponse {
  string run_id = 1;
  string step_id = 2;
  string actor_id = 3;
  string status = 4;
  string outputs = 5;
  int64 completed_at = 6;
}

message WorkflowStepResponsesRequest {
  string workspace_id = 1;
  string user_id = 2;
  string workflow_id = 3;
  string step_id = 4;
}

message WorkflowStepResponsesResponse {
  repeated WorkflowStepResponse responses = 1;
}

message AdminPermissionsRequest {
  string workspace_id = 1;
  string user_id = 2;
  repeated string resource_ids = 3;
}

message AdminPermissionsResponse {
  repeated AutomationPermission permissions = 1;
}

message AdminPermissionMutationRequest {
  string workspace_id = 1;
  string user_id = 2;
  string resource_id = 3;
  AutomationPermission permission = 4;
}

service WorkflowsService {
  rpc StepCompleted(WorkflowStepRequest) returns (WorkflowStepMutationResponse);
  rpc StepFailed(WorkflowStepRequest) returns (WorkflowStepMutationResponse);
  rpc UpdateStep(WorkflowStepUpdateRequest) returns (WorkflowStepMutationResponse);
  rpc CreateWorkflow(WorkflowMutationRequest) returns (WorkflowDefinition);
  rpc GetWorkflow(WorkflowGetRequest) returns (WorkflowDefinition);
  rpc DiscardWorkflowStagedChanges(WorkflowDiscardStagedRequest) returns (WorkflowStepMutationResponse);
  rpc WorkflowStepChanges(WorkflowStepChangesRequest) returns (WorkflowStepChangesResponse);
  rpc DuplicateWorkflow(WorkflowGetRequest) returns (WorkflowDefinition);
  rpc DeleteWorkflow(WorkflowDeleteRequest) returns (WorkflowStepMutationResponse);
  rpc WorkflowActivity(WorkflowGetRequest) returns (WorkflowActivitySummary);
  rpc SubmitWorkflowForm(WorkflowFormSubmitRequest) returns (WorkflowStepMutationResponse);
  rpc CompleteWorkflowButton(WorkflowButtonRequest) returns (WorkflowStepMutationResponse);
  rpc WorkflowRunInteraction(WorkflowRunGetRequest) returns (WorkflowInteraction);
  rpc WorkflowRunExport(WorkflowGetRequest) returns (WorkflowRunListResponse);
  rpc WorkflowFormResponseExport(WorkflowGetRequest) returns (WorkflowFormResponseListResponse);
  rpc SetWorkflowManagers(WorkflowManagersRequest) returns (WorkflowDefinition);
  rpc CanManageWorkflow(WorkflowGetRequest) returns (WorkflowManagePermissionResponse);
  rpc UpdateWorkflow(WorkflowMutationRequest) returns (WorkflowDefinition);
  rpc ListWorkflows(WorkflowListRequest) returns (WorkflowListResponse);
  rpc AdminWorkflows(AdminWorkflowListRequest) returns (WorkflowListResponse);
  rpc AdminUnpublishWorkflows(AdminUnpublishWorkflowsRequest) returns (AdminUnpublishWorkflowsResponse);
  rpc ChangeWorkflowCollaborators(WorkflowCollaboratorsRequest) returns (AdminUnpublishWorkflowsResponse);
  rpc SetWorkflowTrigger(WorkflowTriggerMutationRequest) returns (WorkflowTrigger);
  rpc ListWorkflowTriggers(WorkflowTriggerListRequest) returns (WorkflowTriggerListResponse);
  rpc RunWorkflow(WorkflowRunRequest) returns (WorkflowRun);
  rpc RunAutomaticWorkflow(AutomaticWorkflowRunRequest) returns (WorkflowRun);
  rpc RunWebhookTrigger(WebhookWorkflowRunRequest) returns (WorkflowRun);
  rpc WebhookTriggerURL(WebhookTriggerURLRequest) returns (WebhookTriggerURLResponse);
  rpc DispatchWorkflowEventTriggers(WorkflowEventDispatchRequest) returns (WorkflowEventDispatchResponse);
  rpc GetWorkflowRun(WorkflowRunGetRequest) returns (WorkflowRun);
  rpc CompleteFunction(FunctionCompletionRequest) returns (WorkflowStepMutationResponse);
  rpc GetFunctionPermission(FunctionPermissionRequest) returns (AutomationPermission);
  rpc WorkflowStepResponses(WorkflowStepResponsesRequest) returns (WorkflowStepResponsesResponse);
  rpc AdminFunctionPermissions(AdminPermissionsRequest) returns (AdminPermissionsResponse);
  rpc AdminWorkflowPermissions(AdminPermissionsRequest) returns (AdminPermissionsResponse);
  rpc AdminTriggerTypePermission(AdminPermissionsRequest) returns (AutomationPermission);
  rpc AdminSetFunctionPermission(AdminPermissionMutationRequest) returns (AutomationPermission);
  rpc AdminSetTriggerTypePermission(AdminPermissionMutationRequest) returns (AutomationPermission);
  rpc SetFunctionPermission(FunctionPermissionRequest) returns (AutomationPermission);
  rpc GetTriggerPermission(TriggerPermissionRequest) returns (AutomationPermission);
  rpc SetTriggerPermission(TriggerPermissionRequest) returns (AutomationPermission);
  rpc GetWorkflowPermission(WorkflowPermissionRequest) returns (AutomationPermission);
  rpc SetWorkflowPermission(WorkflowPermissionRequest) returns (AutomationPermission);
  rpc SetFeaturedWorkflows(FeaturedWorkflowsRequest) returns (WorkflowStepMutationResponse);
  rpc ListFeaturedWorkflows(FeaturedWorkflowsRequest) returns (FeaturedWorkflowsResponse);
  rpc ListFunctionWorkflowSteps(FunctionWorkflowStepsRequest) returns (WorkflowStepVersionsResponse);
}
