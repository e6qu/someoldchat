syntax = "proto3";

package sameoldchat.chat.v1;

option go_package = "github.com/sameoldchat/sameoldchat/internal/modules/chat/transport/grpc/gen/sameoldchat/chat/v1;chatv1";

message EventRecord {
  uint64 sequence = 1;
  string id = 2;
  string workspace_id = 3;
  string topic = 4;
  string payload = 5;
  int64 created_at_unix_nano = 6;
  // The actor is part of events.Event and was absent from this message, so every
  // record delivered through the seam lost the user who caused it while the
  // monolith kept it.
  string actor_id = 7;
  // Immutable content snapshot for internal delivery workers. Event's JSON
  // representation omits this field; public SSE and generic record delivery
  // must never expose it.
  string private_payload = 8;
  repeated EventAuthorization authorizations = 9;
}

message EventAuthorization {
  string enterprise_id = 1;
  string team_id = 2;
  string user_id = 3;
  bool is_bot = 4;
  bool is_enterprise_install = 5;
}

message EventsRequest {
  string workspace_id = 1;
  uint64 after = 2;
  int32 limit = 3;
  string app_id = 4;
  string user_id = 5;
}

message EventsResponse {
  repeated EventRecord records = 1;
}

message AppEventClaimRequest {
  string app_id = 1;
  string surface = 2;
  string owner = 3;
  int64 lease_nanos = 4;
}

// AppEventLease is one claimed record with its own delivery state. attempt and
// retry_reason describe this record's earlier deliveries only; they are not an
// app-wide position.
message AppEventLease {
  EventRecord record = 1;
  int32 attempt = 2;
  string retry_reason = 3;
  bool found = 4;
  // The event_ids of this record's fanned-out callbacks the app already
  // accepted; a retry re-posts only the others.
  repeated string delivered_event_ids = 5;
}

message AppEventAckRequest {
  string app_id = 1;
  string surface = 2;
  string owner = 3;
  uint64 sequence = 4;
}

message AppEventReleaseRequest {
  string app_id = 1;
  string surface = 2;
  string owner = 3;
  uint64 sequence = 4;
  string retry_reason = 5;
  int64 retry_at_unix_nano = 6;
  // A failure on this side of the delivery, which does not count as an
  // attempt. False, the value an older peer sends, is a delivery the app
  // failed — the only kind of release that peer could make.
  bool internal_failure = 7;
  // Replaces the record's set of accepted callbacks.
  repeated string delivered_event_ids = 8;
}

message AppEventMutationResponse {
  bool ok = 1;
}

service EventsService {
  rpc ListEventsAfter(EventsRequest) returns (EventsResponse);
  rpc ClaimAppEvent(AppEventClaimRequest) returns (AppEventLease);
  rpc AckAppEvent(AppEventAckRequest) returns (AppEventMutationResponse);
  rpc ReleaseAppEvent(AppEventReleaseRequest) returns (AppEventMutationResponse);
}
