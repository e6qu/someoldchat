syntax = "proto3";

package sameoldchat.chat.v1;

option go_package = "github.com/sameoldchat/sameoldchat/internal/modules/chat/transport/grpc/gen/sameoldchat/chat/v1;chatv1";

import "sameoldchat/chat/v1/conversation_mutations.proto";
import "sameoldchat/chat/v1/messages.proto";
import "sameoldchat/chat/v1/reminders.proto";

message ActivityItem {
  string id = 1;
  string workspace_id = 2;
  string user_id = 3;
  repeated string kinds = 4;
  string actor_id = 5;
  string conversation_id = 6;
  string message_id = 7;
  string reminder_id = 8;
  string reaction_name = 9;
  int64 occurred_at = 10;
  int64 read_at = 11;
  int64 cleared_at = 12;
  Message message = 13;
  LaterReminder reminder = 14;
  bool source_available = 15;
  string canvas_id = 16;
  string canvas_title = 17;
  string list_item_id = 18;
  string list_id = 19;
  string list_name = 20;
  ListItemSummary list_item = 21;
  string shared_invite_id = 22;
  string shared_invite_status = 23;
  string app_reminder_id = 24;
  Reminder app_reminder = 25;
}

// ListItemSummary is what an Activity row needs to name assigned work without
// carrying the whole item across the seam.
message ListItemSummary {
  string id = 1;
  string fields = 2;
  bool archived = 3;
  int64 due_at_unix_nano = 4;
}

message ActivityRequest {
  string workspace_id = 1;
  string user_id = 2;
  repeated string kinds = 3;
  bool unread_only = 4;
  bool cleared_only = 5;
  int32 limit = 6;
  string cursor = 7;
}

message ActivityPage {
  repeated ActivityItem items = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message MutateActivityRequest {
  string workspace_id = 1;
  string user_id = 2;
  repeated string activity_ids = 3;
  string mutation = 4;
}

message ActivityPreferencesRequest {
  string workspace_id = 1;
  string user_id = 2;
}

message SetActivityPreferencesRequest {
  string workspace_id = 1;
  string user_id = 2;
  string layout = 3;
}

message ActivityPreferences {
  string workspace_id = 1;
  string user_id = 2;
  string layout = 3;
  repeated ActivitySavedView saved_views = 4;
}

message ActivitySavedView {
  string id = 1;
  string workspace_id = 2;
  string user_id = 3;
  string name = 4;
  repeated string kinds = 5;
  int64 created_at_unix_nano = 6;
}

message CreateActivitySavedViewRequest {
  string workspace_id = 1;
  string user_id = 2;
  string name = 3;
  repeated string kinds = 4;
}

message DeleteActivitySavedViewRequest {
  string workspace_id = 1;
  string user_id = 2;
  string view_id = 3;
}

message SidebarSection {
  string id = 1;
  string workspace_id = 2;
  string user_id = 3;
  string name = 4;
  int32 position = 5;
  bool collapsed = 6;
  int64 created_at_unix_nano = 7;
  repeated string conversations = 8;
  string notification_level = 9;
}

message SetSidebarSectionNotificationLevelRequest {
  string workspace_id = 1;
  string user_id = 2;
  string section_id = 3;
  string level = 4;
}

message SidebarSectionsRequest {
  string workspace_id = 1;
  string user_id = 2;
}

message SidebarSectionsResponse {
  repeated SidebarSection sections = 1;
}

message CreateSidebarSectionRequest {
  string workspace_id = 1;
  string user_id = 2;
  string name = 3;
}

message RenameSidebarSectionRequest {
  string workspace_id = 1;
  string user_id = 2;
  string section_id = 3;
  string name = 4;
}

message SetSidebarSectionCollapsedRequest {
  string workspace_id = 1;
  string user_id = 2;
  string section_id = 3;
  bool collapsed = 4;
}

message DeleteSidebarSectionRequest {
  string workspace_id = 1;
  string user_id = 2;
  string section_id = 3;
}

message ReorderSidebarSectionsRequest {
  string workspace_id = 1;
  string user_id = 2;
  repeated string section_ids = 3;
}

message AssignConversationToSidebarSectionRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string section_id = 4;
  string after_conversation_id = 5;
}

message NotificationPreferencesRequest {
  string workspace_id = 1;
  string user_id = 2;
}

message WorkspaceNotificationPreferences {
  string workspace_id = 1;
  string user_id = 2;
  string level = 3;
  repeated string keywords = 4;
  bool activity_channels = 5;
  bool activity_reminders = 6;
  bool browser_notifications = 7;
  NotificationSchedule schedule = 8;
  repeated string vips = 9;
}

message SetNotificationVIPRequest {
  string workspace_id = 1;
  string user_id = 2;
  string target_id = 3;
  bool add = 4;
}

message NotificationSchedule {
  bool enabled = 1;
  repeated int32 days = 2;
  int32 start_minute = 3;
  int32 end_minute = 4;
  string time_zone = 5;
}

message SetNotificationScheduleRequest {
  string workspace_id = 1;
  string user_id = 2;
  NotificationSchedule schedule = 3;
}

message SetWorkspaceNotificationPreferencesRequest {
  string workspace_id = 1;
  string user_id = 2;
  string level = 3;
  repeated string keywords = 4;
  bool activity_channels = 5;
  bool activity_reminders = 6;
  bool browser_notifications = 7;
}

message ConversationNotificationPreferencesRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
}

message ConversationNotificationPreferences {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string level = 4;
  bool follow_every_thread = 5;
}

message SetConversationNotificationPreferencesRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string level = 4;
  bool follow_every_thread = 5;
}

message ThreadFollowRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string thread_timestamp = 4;
}

message SetThreadFollowRequest {
  string workspace_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string thread_timestamp = 4;
  bool followed = 5;
}

message ThreadFollow {
  bool followed = 1;
}

service ActivityService {
  rpc ListActivity(ActivityRequest) returns (ActivityPage);
  rpc MutateActivity(MutateActivityRequest) returns (MutationResponse);
  rpc GetActivityPreferences(ActivityPreferencesRequest) returns (ActivityPreferences);
  rpc SetActivityPreferences(SetActivityPreferencesRequest) returns (ActivityPreferences);
  rpc CreateActivitySavedView(CreateActivitySavedViewRequest) returns (ActivitySavedView);
  rpc DeleteActivitySavedView(DeleteActivitySavedViewRequest) returns (MutationResponse);
  rpc GetWorkspaceNotificationPreferences(NotificationPreferencesRequest) returns (WorkspaceNotificationPreferences);
  rpc SetWorkspaceNotificationPreferences(SetWorkspaceNotificationPreferencesRequest) returns (WorkspaceNotificationPreferences);
  rpc SetNotificationSchedule(SetNotificationScheduleRequest) returns (WorkspaceNotificationPreferences);
  rpc SetNotificationVIP(SetNotificationVIPRequest) returns (MutationResponse);
  rpc SidebarSections(SidebarSectionsRequest) returns (SidebarSectionsResponse);
  rpc CreateSidebarSection(CreateSidebarSectionRequest) returns (SidebarSection);
  rpc RenameSidebarSection(RenameSidebarSectionRequest) returns (MutationResponse);
  rpc SetSidebarSectionCollapsed(SetSidebarSectionCollapsedRequest) returns (MutationResponse);
  rpc SetSidebarSectionNotificationLevel(SetSidebarSectionNotificationLevelRequest) returns (MutationResponse);
  rpc DeleteSidebarSection(DeleteSidebarSectionRequest) returns (MutationResponse);
  rpc ReorderSidebarSections(ReorderSidebarSectionsRequest) returns (MutationResponse);
  rpc AssignConversationToSidebarSection(AssignConversationToSidebarSectionRequest) returns (MutationResponse);
  rpc GetConversationNotificationPreferences(ConversationNotificationPreferencesRequest) returns (ConversationNotificationPreferences);
  rpc SetConversationNotificationPreferences(SetConversationNotificationPreferencesRequest) returns (ConversationNotificationPreferences);
  rpc GetThreadFollow(ThreadFollowRequest) returns (ThreadFollow);
  rpc SetThreadFollow(SetThreadFollowRequest) returns (ThreadFollow);
}
