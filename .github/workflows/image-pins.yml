name: Image pins

# Every pinned container image is a Docker Hub copy on public.ecr.aws or
# mirror.gcr.io. This compares each pin with what Docker Hub serves for its tag,
# so a stale pin shows up on pull requests and, through the daily run, on main
# without one.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-pins-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image-pins:
    name: Image pins are current
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Compare image pins with Docker Hub
        run: make image-pins-check
