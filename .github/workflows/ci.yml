name: CI

on:
  pull_request:
  # A commit can reach the default branch without a pull request (direct push,
  # administrative merge, `gh pr merge --admin`). Gating pushes as well means no
  # commit on `main` is unverified, and `publish-container.yml` calls this
  # workflow so a container can never be built from an unverified commit.
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # Superseded pull-request runs are cancelled. Runs keyed to a commit are not:
  # a publication depends on this workflow's result, and cancelling it would
  # either block the release or, worse, let a later push retire the verification
  # a half-finished publication relies on.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pull-request' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-24.04
    # The complete race suite alone takes about eight minutes on the hosted
    # runner. Keep enough room for fuzzing, vulnerability analysis, and every
    # static binary instead of cancelling a healthy release gate near the end.
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # buf is no longer installed by a third-party action: `make proto-tools`
      # builds the version pinned by BUF_VERSION in the Makefile, the same way the
      # protoc plugins are built, so the local gate and this gate cannot select
      # different lint and breaking-change rule sets.
      - name: Check formatting and generated files
        run: make fmt-check workflow-check container-check module-docs-check module-startup-check task-flags-check dependency-check generated-check proto-lint

      - name: Check contracts, journeys, and SDK inventory
        run: make contract-check journey-check sdk-inventory-check

      - name: Ratchet compatibility ledger
        env:
          # `github.base_ref` is empty for `push` and `workflow_call`; the first
          # parent of the pushed commit is the ledger the ratchet must compare
          # against there.
          BASE_REF: ${{ github.base_ref != '' && format('origin/{0}', github.base_ref) || format('{0}^', github.sha) }}
        run: |
          if git cat-file -e "$BASE_REF:specs/compatibility.yaml" 2>/dev/null; then
            make contract-ratchet BASE_REF="$BASE_REF"
          else
            echo "Compatibility ratchet bootstrap: $BASE_REF has no compatibility ledger."
            make contract-check
          fi

      # The gRPC wire contract needs the same ratchet as the Slack HTTP ledger:
      # the distributed profile runs http and chat at independent replica counts,
      # so a rollout always serves mixed versions of this contract.
      - name: Ratchet protobuf wire compatibility
        env:
          BASE_REF: ${{ github.base_ref != '' && format('origin/{0}', github.base_ref) || format('{0}^', github.sha) }}
        run: |
          if git cat-file -e "$BASE_REF:buf.yaml" 2>/dev/null; then
            make proto-breaking BASE_REF="$BASE_REF"
          else
            echo "Protobuf breaking-change bootstrap: $BASE_REF has no buf configuration."
            make proto-lint
          fi

      - name: Report compatibility progress
        run: make compatibility-report

      - name: Run tests
        run: make test

      - name: Run bounded load tests
        run: make test-load

      - name: Run distributed transport load test
        run: make test-transport-load

      - name: Run fuzz smoke tests
        run: make test-fuzz

      - name: Run race tests
        run: make test-race

      - name: Run static analysis
        run: make vet

      - name: Scan for known vulnerabilities
        run: make vuln-check

      - name: Build static binaries
        run: make build-static

  terraform:
    name: Terraform validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory:
          - deploy/ecs-scale-zero
          - terraform/ecs-runtime
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate

      # A module's README example is a call an operator copies, and
      # `terraform validate` never reads a README. module-docs-check compares
      # argument names, which cannot see a type error or the module's own
      # `validation` blocks — so deploy/ecs-scale-zero's example could document
      # the task-local store the module exists to forbid, with every gate green.
      # This job is the only one with Terraform, so it is the only place the
      # example can be validated for real.
      - name: Validate the module README example
        working-directory: ${{ github.workspace }}
        run: ./scripts/check-terraform-module-examples.sh "${{ matrix.directory }}"

  # The WebSocket edge image and the activator Lambda were the only shipped
  # deployment artifacts no workflow exercised, which is why an arm64-only build
  # and three defects in activator.py all survived every gate.
  scale-zero-artifacts:
    name: Scale-to-zero deployment artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.11'

      - name: Test the activator Lambda
        run: make activator-check

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the WebSocket edge image for both published architectures
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#linux/}"
            docker buildx build \
              --platform "$platform" \
              --file deploy/ecs-scale-zero/Dockerfile.websocket-edge \
              --output "type=local,dest=${RUNNER_TEMP}/edge-${arch}" .
            docker buildx build \
              --platform "$platform" \
              --file deploy/ecs-scale-zero/Dockerfile.worker \
              --output "type=local,dest=${RUNNER_TEMP}/worker-${arch}" .
          done

      - name: Assert the deployment binaries match the requested architectures
        run: |
          set -euo pipefail
          expect_amd64="$(file -b "${RUNNER_TEMP}/edge-amd64/ecs-ws-activator")"
          expect_arm64="$(file -b "${RUNNER_TEMP}/edge-arm64/ecs-ws-activator")"
          worker_amd64="$(file -b "${RUNNER_TEMP}/worker-amd64/sameoldchat-worker")"
          worker_arm64="$(file -b "${RUNNER_TEMP}/worker-arm64/sameoldchat-worker")"
          echo "amd64: $expect_amd64"
          echo "arm64: $expect_arm64"
          case "$expect_amd64" in *x86-64*) ;; *) echo 'linux/amd64 build did not produce an x86-64 binary' >&2; exit 1 ;; esac
          case "$expect_arm64" in *aarch64*) ;; *) echo 'linux/arm64 build did not produce an aarch64 binary' >&2; exit 1 ;; esac
          case "$worker_amd64" in *x86-64*) ;; *) echo 'linux/amd64 worker build did not produce an x86-64 binary' >&2; exit 1 ;; esac
          case "$worker_arm64" in *aarch64*) ;; *) echo 'linux/arm64 worker build did not produce an aarch64 binary' >&2; exit 1 ;; esac

  sdk:
    name: Official SDK qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.7.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.11'

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17.0.15'
          cache: maven

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.8.1

      - name: Verify current official Slack contracts
        run: make external-contract-qualification

      - name: Run official SDK qualification
        run: make sdk-qualification

  browser:
    name: Browser qualification
    runs-on: ubuntu-24.04
    # The suite runs every test in three engines with workers: 1, and the job
    # also pays for npm ci and three browser downloads. It last measured 7m37s
    # at 40 tests; this PR adds journeys for huddles, Slack Connect, the
    # workspace switcher and the administration surfaces, so the ceiling moves
    # with them rather than being discovered by a timeout in CI.
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.7.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install browser qualification dependencies
        run: make browser-qualification

      # Playwright already records a trace, a DOM snapshot and the network
      # exchange for a failed test — the config asks for it — and this job threw
      # all of it away. `[ACT-02 ACT-03]` has failed here roughly one run in four
      # for several releases and is not reproducible locally, and every attempt
      # to explain it from the assertion message alone has been wrong. Keeping
      # what the run already captured is the difference between the next
      # occurrence being evidence and being another guess.
      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-qualification-failure
          path: tests/browser/test-results
          retention-days: 14
          if-no-files-found: ignore

  shauth-sso:
    name: Shauth SSO qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out SameOldChat
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check out the exact Shauth contract
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: e6qu/shauth
          ref: 0fda680cba964e5768ed75a9c3e5b7230c418ca6
          path: .qualification/shauth

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.7.0

      - name: Install the browser contract dependencies
        run: |
          npm ci --prefix tests/browser
          npx --prefix tests/browser playwright install --with-deps chromium

      - name: Run the real Shauth, Ory Hydra, PostgreSQL, and browser matrix
        env:
          SHAUTH_SOURCE_DIR: ${{ github.workspace }}/.qualification/shauth
        run: make shauth-sso-qualification

  dqlite:
    name: dqlite qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native dqlite dependencies
        run: |
          sudo add-apt-repository -y ppa:dqlite/dev
          sudo apt-get update
          sudo apt-get install -y \
            dqlite-tools-v3=3.0.4~noble1 \
            libdqlite-dev=1.18.3~noble1 \
            libdqlite1.18=1.18.7~noble1 \
            libdqlite1.18-dev=1.18.7~noble1 \
            libuv1-dev=1.48.0-1.1build1

      - name: Build dqlite binaries
        run: make build-dqlite

      # `make vet` and `make vuln-check` analyse the default build
      # configuration, so internal/store/dqlite and every dqlite-tagged file were
      # analysed and scanned by nothing at all, and github.com/canonical/go-dqlite
      # was never reached by govulncheck. This is the only job with the native
      # headers, so it is the only place they can run.
      - name: Run static analysis and vulnerability scan over dqlite-tagged code
        run: make vet-dqlite vuln-check-dqlite

      - name: Run dqlite tests
        run: make test-dqlite

  postgres:
    name: PostgreSQL qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.1@sha256:1090bc3a8ccfb0b55f78a494d76f8d603434f7e4553543d6e807bc7bd6bbd17f
        env:
          POSTGRES_USER: sameoldchat
          POSTGRES_PASSWORD: sameoldchat
          POSTGRES_DB: sameoldchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sameoldchat -d sameoldchat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run PostgreSQL qualification
        env:
          SAMEOLDCHAT_POSTGRES_DSN: postgres://sameoldchat:sameoldchat@localhost:5432/sameoldchat?sslmode=disable
        run: make test-postgres
