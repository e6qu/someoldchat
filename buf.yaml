version: v2

modules:
  - path: proto

# The http and chat processes of the separate-chat and separate-chat-replicated
# targets (modules.json) carry independent replica counts, so a rollout always
# runs mixed versions of this contract for a while. WIRE_JSON rejects the changes
# that corrupt requests across that skew — renumbering or deleting a field,
# changing its type or cardinality, renaming a message, service or RPC — while
# still allowing additive evolution.
breaking:
  use:
    - WIRE_JSON

lint:
  use:
    - STANDARD
  # Presence intentionally reuses the stable User model for several
  # operations; the shared response is the contract, not an untyped envelope.
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
